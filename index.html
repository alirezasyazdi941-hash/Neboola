const Notify = (() => {
  const container = document.getElementById('toasts');
  const ICONS = {
    success:'<path d="M20 6L9 17l-5-5"/>',
    error:'<circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/>',
    warning:'<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
    info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
    loading:'<path d="M21 12a9 9 0 1 1-6.2-8.6"/>'
  };
  function show({ title, message='', type='info', duration=4000, id=null } = {}){
    if (!container) return null;
    const toastId = id || Utils.uid('toast');
    const el = document.createElement('div');
    el.className = 'toast'; el.dataset.type = type; el.dataset.id = toastId;
    el.innerHTML = `
      <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[type] || ICONS.info}</svg>
      <div class="toast-body">
        <div class="toast-title">${Utils.esc(title)}</div>
        ${message ? `<div class="toast-msg">${Utils.esc(message)}</div>` : ''}
      </div>
      <button class="toast-close" aria-label="Dismiss notification">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>`;
    const dismiss = () => {
      if (el.classList.contains('out')) return;
      el.classList.add('out'); setTimeout(() => el.remove(), 240);
    };
    el.querySelector('.toast-close').addEventListener('click', dismiss);
    container.appendChild(el);
    if (type !== 'loading' && duration > 0) setTimeout(dismiss, duration);
    return { id: toastId, dismiss, el };
  }
  function update(id, { title, message, type='success' }){
    const el = container?.querySelector(`[data-id="${id}"]`); if (!el) return;
    el.dataset.type = type;
    if (title) el.querySelector('.toast-title').textContent = title;
    const msgEl = el.querySelector('.toast-msg');
    if (message && msgEl) msgEl.textContent = message;
    el.querySelector('.toast-icon').innerHTML = ICONS[type] || ICONS.info;
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 240); }, 3200);
  }
  return {
    show, update,
    success:(t,m,d)=>show({title:t,message:m,type:'success',duration:d}),
    error:(t,m,d)=>show({title:t,message:m,type:'error',duration:d||6000}),
    warning:(t,m,d)=>show({title:t,message:m,type:'warning',duration:d}),
    info:(t,m,d)=>show({title:t,message:m,type:'info',duration:d}),
    loading:(t,m)=>show({title:t,message:m,type:'loading',duration:0})
  };
})();

/* ==========================================================================
 * 11. MODAL LAYER
 * ========================================================================== */
const Modal = (() => {
  const root = document.getElementById('modal-root');
  let activeOverlay = null;
  let lastFocused = null;

  function close(){
    if (!activeOverlay) return;
    const o = activeOverlay; activeOverlay = null;
    o.style.animation = 'fadeIn .18s reverse';
    setTimeout(() => o.remove(), 160);
    if (lastFocused && typeof lastFocused.focus === 'function'){
      try { lastFocused.focus(); } catch(e){}
    }
  }
  function open({ title, subtitle, icon='sparkles', body='', actions=[], size=520, onMount=null }){
    close();
    lastFocused = document.activeElement;
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.setAttribute('role','dialog');
    overlay.setAttribute('aria-modal','true');
    overlay.setAttribute('aria-label', title);
    const iconSvg = ICON_PATHS[icon] || ICON_PATHS.sparkles;
    overlay.innerHTML = `
      <div class="modal" style="max-width:${size}px">
        <div class="modal-head">
          <div class="modal-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${iconSvg}</svg>
          </div>
          <div style="flex:1;min-width:0">
            <h2>${Utils.esc(title)}</h2>
            ${subtitle ? `<p>${Utils.esc(subtitle)}</p>` : ''}
          </div>
        </div>
        <div class="modal-body">${body}</div>
        ${actions.length ? `<div class="modal-foot">${actions.map((a,i) =>
          `<button class="btn ${a.variant||'ghost'}" data-modal-action="${i}">${Utils.esc(a.label)}</button>`
        ).join('')}</div>` : ''}
      </div>`;
    overlay.addEventListener('mousedown', e => { if (e.target === overlay) close(); });
    overlay.querySelectorAll('[data-modal-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const action = actions[Number(btn.dataset.modalAction)];
        if (!action) return;
        if (action.onClick) action.onClick(overlay, close);
        else close();
      });
    });
    root.appendChild(overlay);
    activeOverlay = overlay;
    const focusable = overlay.querySelector('input, textarea, select, button:not([data-modal-action="cancel"])');
    setTimeout(() => focusable?.focus(), 60);
    if (onMount){ try { onMount(overlay, close); } catch(err){ console.error('[Modal] onMount', err); } }
    return { overlay, close };
  }
  function confirm({ title, message, confirmLabel='Confirm', variant='primary' }){
    return new Promise(resolve => {
      let settled = false;
      const done = val => { if (!settled){ settled = true; resolve(val); } };
      open({
        title, subtitle: message, icon: 'alert', size: 430, body: '',
        actions: [
          { label:'Cancel', variant:'ghost', onClick:(o,c)=>{ done(false); c(); } },
          { label:confirmLabel, variant, onClick:(o,c)=>{ done(true); c(); } }
        ]
      });
      const obs = new MutationObserver(() => {
        if (!document.getElementById('modal-root')?.firstChild){
          obs.disconnect(); done(false);
        }
      });
      obs.observe(document.getElementById('modal-root'), { childList:true });
    });
  }
  return { open, close, confirm, isOpen: () => Boolean(activeOverlay) };
})();

/* ==========================================================================
 * 12. COMMAND PALETTE
 * ========================================================================== */
const Palette = (() => {
  const root = document.getElementById('palette-root');
  let overlay = null, results = [], activeIndex = 0, currentQuery = '';

  function buildIndex(){
    const s = Store.get();
    const items = [];

    [
      { view:'dashboard', title:'Studio',    sub:'Project overview',      icon:'grid' },
      { view:'workspace', title:'Files',     sub:'File workspace',        icon:'folder' },
      { view:'editor',    title:'Canvas',    sub:'Visual canvas editor',  icon:'layers' },
      { view:'activity',  title:'Activity',  sub:'Recent changes',        icon:'activity' },
      { view:'settings',  title:'Settings',  sub:'Preferences and API',   icon:'settings' }
    ].forEach(v => items.push({
      group:'Navigate', title:v.title, subtitle:v.sub, icon:v.icon,
      keywords:[v.view, v.title],
      run: () => Actions.navigate(null, { dataset:{ view:v.view } })
    }));

    const commands = [
      { title:'Import files…',   sub:'Open the Import Center', icon:'upload',   run:() => Actions['open-import']() },
      { title:'Export project…', sub:'Open the Export Center', icon:'download', run:() => Actions['open-export']() },
      { title:'New project',     sub:'Generate from a prompt', icon:'plus',     run:() => Actions['new-project']() },
      { title:'Save project',    sub:'Write changes locally',  icon:'save',     run:() => Actions['save-project']() },
      { title:'Export website',  sub:'Download a complete site', icon:'globe',  run:() => Actions['export-website']() },
      { title:'Export ZIP',      sub:'Package the project',    icon:'package',  run:() => Actions['export-zip']() },
      { title:'Toggle preview',  sub:'Hide editor chrome',     icon:'eye',      run:() => Actions['toggle-preview']() },
      { title:'Undo',            sub:'Revert last change',     icon:'undo',     run:() => Actions.undo() },
      { title:'Redo',            sub:'Reapply change',         icon:'redo',     run:() => Actions.redo() },
      { title:'Keyboard shortcuts', sub:'Show all shortcuts',  icon:'keyboard', run:() => Actions['show-shortcuts']() }
    ];
    commands.forEach(c => items.push({
      group:'Commands', title:c.title, subtitle:c.sub, icon:c.icon,
      keywords:[c.title, c.sub], run:c.run
    }));

    s.projects.forEach(p => {
      items.push({
        group:'Projects', title:p.name,
        subtitle:`${p.pages.length} page${p.pages.length===1?'':'s'} · ${(p.files||[]).length} files · ${p.tag}`,
        icon:'file', keywords:[p.name, p.description, p.tag],
        run:() => { openProject(p.id); Actions.navigate(null, { dataset:{ view:'workspace' } }); }
      });
      // Files
      (p.files || []).forEach(f => {
        items.push({
          group:'Files', title:f.path, subtitle:`${p.name} · ${Utils.formatBytes(f.size)}`,
          icon: FileTypes.iconFor(f.name), keywords:[f.path, p.name, f.mime || ''],
          run:() => { openProject(p.id); openFileInWorkspace(f.id); Actions.navigate(null, { dataset:{ view:'workspace' } }); }
        });
      });
      // Canvas elements
      p.pages.forEach(pg => {
        pg.elements.forEach(el => {
          const text = el.props?.text || el.props?.title || '';
          if (!text) return;
          items.push({
            group:'Canvas elements', title:text.slice(0,72),
            subtitle:`${p.name} · ${pg.name} · ${el.name}`,
            icon:'type', keywords:[text, el.name, el.type],
            run:() => {
              openProject(p.id); openPage(pg.id);
              Actions.navigate(null, { dataset:{ view:'editor' } });
              setTimeout(() => { selectElement(el.id); ScrollToElement(el.id); }, 120);
            }
          });
        });
      });
    });

    return items;
  }

  function open(initialQuery=''){
    if (overlay) return;
    overlay = document.createElement('div');
    overlay.className = 'palette-wrap';
    overlay.innerHTML = `
      <div class="palette" role="dialog" aria-modal="true" aria-label="Search">
        <div class="palette-input-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input class="palette-input" id="palette-input" type="text" placeholder="Search projects, files, elements, commands…" autocomplete="off" spellcheck="false" aria-label="Search query"/>
          <span class="palette-key">ESC</span>
        </div>
        <div class="palette-results" id="palette-results"></div>
        <div class="palette-foot">
          <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
          <span><kbd>↵</kbd> open</span>
          <span><kbd>ESC</kbd> close</span>
        </div>
      </div>`;
    overlay.addEventListener('mousedown', e => { if (e.target === overlay) close(); });
    root.appendChild(overlay);
    const input = overlay.querySelector('#palette-input');
    input.value = initialQuery;
    input.addEventListener('input', Utils.debounce(() => { currentQuery = input.value; render(); }, 90));
    input.addEventListener('keydown', onKeyDown);
    currentQuery = initialQuery;
    render();
    setTimeout(() => input.focus(), 40);
  }
  function close(){
    if (!overlay) return;
    overlay.remove(); overlay = null; results = []; activeIndex = 0;
  }
  async function render(){
    const box = overlay?.querySelector('#palette-results'); if (!box) return;
    const all = buildIndex();
    const ranked = await SearchService.query(all, currentQuery);
    if (!currentQuery.trim()){
      const recent = Store.get().search.recent || [];
      if (recent.length){
        const recentItems = recent.map(r => all.find(i => i.title === r)).filter(Boolean);
        results = [...recentItems, ...ranked.filter(r => !recentItems.includes(r))].slice(0,14);
      } else results = ranked.slice(0,14);
    } else results = ranked.slice(0,20);
    activeIndex = 0;
    if (!results.length){
      box.innerHTML = `<div class="palette-empty">No matches for “${Utils.esc(currentQuery)}”</div>`;
      return;
    }
    const groups = new Map();
    results.forEach(r => {
      if (!groups.has(r.group)) groups.set(r.group, []);
      groups.get(r.group).push(r);
    });
    let html = '', flat = 0;
    groups.forEach((items, groupName) => {
      html += `<div class="palette-group-label">${Utils.esc(groupName)}</div>`;
      items.forEach(item => {
        const i = flat++;
        html += `
          <button class="palette-item${i===activeIndex?' active':''}" data-index="${i}">
            <span class="palette-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[item.icon] || ICON_PATHS.file}</svg></span>
            <span class="palette-text">
              <span class="palette-title">${highlight(item.title, currentQuery)}</span>
              <span class="palette-sub">${Utils.esc(item.subtitle||'')}</span>
            </span>
          </button>`;
      });
    });
    box.innerHTML = html;
    box.querySelectorAll('.palette-item').forEach(btn => {
      btn.addEventListener('click', () => runIndex(Number(btn.dataset.index)));
      btn.addEventListener('mousemove', () => {
        const idx = Number(btn.dataset.index);
        if (idx === activeIndex) return;
        activeIndex = idx;
        box.querySelectorAll('.palette-item').forEach(b => b.classList.toggle('active', Number(b.dataset.index) === activeIndex));
      });
    });
  }
  function highlight(text, query){
    const safe = Utils.esc(text);
    const q = String(query||'').trim();
    if (!q) return safe;
    const terms = q.split(/\s+/).filter(Boolean).map(escapeRe);
    if (!terms.length) return safe;
    return safe.replace(new RegExp(`(${terms.join('|')})`,'gi'), '<mark>$1</mark>');
  }
  function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
  function onKeyDown(e){
    if (e.key === 'ArrowDown'){ e.preventDefault(); activeIndex = Math.min(results.length-1, activeIndex+1); sync(); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); activeIndex = Math.max(0, activeIndex-1); sync(); }
    else if (e.key === 'Enter'){ e.preventDefault(); runIndex(activeIndex); }
    else if (e.key === 'Escape'){ e.preventDefault(); close(); }
  }
  function sync(){
    const box = overlay?.querySelector('#palette-results'); if (!box) return;
    box.querySelectorAll('.palette-item').forEach(b => b.classList.toggle('active', Number(b.dataset.index) === activeIndex));
    box.querySelector('.palette-item.active')?.scrollIntoView({ block:'nearest' });
  }
  function runIndex(i){
    const item = results[i]; if (!item) return;
    if (currentQuery.trim()){
      const recent = [currentQuery, ...(Store.get().search.recent||[]).filter(r => r !== currentQuery)].slice(0,5);
      Store.patch('search', { recent });
      Storage.set('search', Store.get().search);
    }
    close();
    try { item.run(); }
    catch(err){ Notify.error('Action failed', err.message || 'Something went wrong.'); }
  }
  return { open, close, isOpen: () => Boolean(overlay) };
})();

function getLayout(el, device){
  const base = el.layout.desktop;
  if (device === 'desktop') return base;
  if (el.layout[device]) return el.layout[device];
  const ratio = DEVICE_WIDTHS[device] / DEVICE_WIDTHS.desktop;
  const pad = device === 'mobile' ? 20 : 40;
  const maxW = DEVICE_WIDTHS[device] - pad*2;
  const x = Math.round(Math.min(base.x * ratio, DEVICE_WIDTHS[device] - pad - 40));
  const w = Math.round(Math.min(Math.max(base.w * ratio, 120), maxW));
  return { x: Math.max(pad*0.5, x), y: base.y, w, h: base.h };
}
function setLayoutValue(el, device, key, value){
  if (device === 'desktop') el.layout.desktop[key] = value;
  else {
    if (!el.layout[device]) el.layout[device] = Object.assign({}, getLayout(el, device));
    el.layout[device][key] = value;
  }
}
function elementStyleString(el, layout){
  const s = el.style || {};
  return [
    `left:${layout.x}px`, `top:${layout.y}px`, `width:${layout.w}px`, `height:${layout.h}px`,
    `z-index:${el.z||1}`, `opacity:${el.visible===false?0.25:(s.opacity==null?1:s.opacity)}`,
    `color:${s.color||'#e9edf7'}`, `background:${s.bg||'transparent'}`,
    `border-radius:${s.radius||0}px`, `padding:${s.padding||0}px`,
    `font-size:${s.fontSize||16}px`, `font-weight:${s.fontWeight||400}`,
    `font-family:${s.fontFamily==='inherit'||!s.fontFamily?'inherit':s.fontFamily}`,
    `line-height:${s.lineHeight||1.5}`, `letter-spacing:${s.letterSpacing||0}px`,
    `text-align:${s.align||'left'}`,
    `box-shadow:${SHADOWS[s.shadow] || s.shadow || 'none'}`,
    `border:${s.borderWidth||0}px solid ${s.borderColor||'transparent'}`,
    'display:flex', 'flex-direction:column',
    `justify-content:${s.vAlign||'flex-start'}`, 'overflow:hidden'
  ].join(';');
}
function elementInnerHTML(el){
  const p = el.props || {}, s = el.style || {};
  switch (el.type){
    case 'image':{
      const src = p.src || buildGradientDataURI(el.id);
      return `<img class="el-img" src="${Utils.esc(src)}" alt="${Utils.esc(p.alt||el.name)}" draggable="false"/>`;
    }
    case 'divider': return `<div class="el-divider"></div>`;
    case 'button': return `<div class="el-inner" style="align-items:center;justify-content:center">
      <span class="el-btn" style="background:${s.bg && s.bg !== 'transparent' ? s.bg : 'linear-gradient(135deg,#2f8bff,#7c5cf6)'};color:${s.color||'#fff'}">${Utils.esc(p.text||'Button')}</span>
    </div>`;
    case 'card': return `<div class="el-inner" style="flex-direction:column;gap:8px;justify-content:center">
      ${p.title ? `<div style="font-weight:650;font-size:${Math.max(15,(s.fontSize||16))}px;line-height:1.3">${Utils.esc(p.title)}</div>` : ''}
      ${p.text ? `<div style="font-size:13.5px;opacity:.72;line-height:1.55;font-weight:400">${Utils.esc(p.text)}</div>` : ''}
    </div>`;
    case 'badge': return `<div class="el-inner" style="align-items:center;justify-content:center">
      <span style="display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;
        background:${s.bg && s.bg !== 'transparent' ? s.bg : 'rgba(77,163,255,.14)'};
        color:${s.color||'#9ecbff'};font-weight:600;font-size:${s.fontSize||12}px;white-space:nowrap">
        ${Utils.esc(p.text||'Badge')}</span>
    </div>`;
    case 'spacer': return '';
    default: return `<div class="el-inner"><div class="el-text">${Utils.esc(p.text||'')}</div></div>`;
  }
}
function createElementOfType(type, x=80, y=80){
  const base = {
    id: Utils.uid('el'), type,
    name: ELEMENT_TYPES[type] || 'Element',
    layout: { desktop: { x, y, w:320, h:80 } },

      base.layout.desktop = { x, y, w:176, h:48 };

      base.style = Object.assign(base.style, { radius:18, shadow:'deep' });
      base.layout.desktop = { x, y, w:420, h:280 };
      break;
    case 'card':
      base.props = { title:'Card title', text:'A short supporting sentence for this card.' };
      base.style = Object.assign(base.style, { bg:'rgba(255,255,255,.045)', radius:18, padding:22, borderWidth:1, borderColor:'rgba(255,255,255,.09)', shadow:'soft' });
      base.layout.desktop = { x, y, w:340, h:160 };
      break;
    case 'badge':
      base.props = { text:'New' };
      base.style = Object.assign(base.style, { bg:'rgba(77,163,255,.14)', color:'#9ecbff', fontSize:12, fontWeight:700, radius:999 });
      base.layout.desktop = { x, y, w:84, h:30 };

      base.layout.desktop = { x, y, w:520, h:1 };
      break;
    case 'spacer':
      base.layout.desktop = { x, y, w:320, h:40 };
      break;
  }
  return base;
}

  const statusElements = document.getElementById('status-elements');
  const statusFiles = document.getElementById('status-files');
  const statusApi = document.getElementById('status-api');
  const saveStatus = document.getElementById('save-status');
  const saveDot = document.getElementById('save-dot');

  if (statusProject) statusProject.textContent = project ? `${project.name} · ${page ? page.name : '—'}` : 'No project';

      statusFiles.textContent = `${project.files.length} files · ${Utils.formatBytes(totalSize)}`;

  if (statusApi) statusApi.textContent = AIService.isLive() ? `Live · ${API_CONFIG.provider}` : 'Mock services';

  if (saveStatus && saveDot){
    const st = s.ui.saveState;
    if (st === 'saving'){ saveStatus.textContent = 'Saving…'; saveDot.className = 'status-dot saving'; }
    else if (st === 'saved'){ saveStatus.textContent = 'Saved ' + Utils.relTime(s.ui.lastSavedAt||Date.now()); saveDot.className = 'status-dot'; }
    else { saveStatus.textContent = 'Ready'; saveDot.className = 'status-dot'; }

  const badge = document.getElementById('mode-badge');
  if (badge){
    if (AIService.isLive()){ badge.className = 'badge live'; badge.innerHTML = '<span class="dot"></span> Live API'; }
    else { badge.className = 'badge demo'; badge.innerHTML = '<span class="dot"></span> Demo Mode'; }
  }

  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('sidebar-backdrop');
  if (sidebar) sidebar.classList.toggle('open', s.editor.sidebarOpen);
  if (backdrop) backdrop.classList.toggle('show', s.editor.sidebarOpen);
}

function elementHTML(el, device, s){
  const layout = getLayout(el, device);
  const classes = ['canvas-el'];
  if (el.id === s.selectedElementId) classes.push('selected');
  if (el.visible === false) classes.push('hidden-el');
  if (el.locked) classes.push('locked-el');
  const motionAttr = el.motion && el.motion.type !== 'none'
    ? `data-motion="${el.motion.type}" data-motion-dur="${el.motion.duration}"` : '';
  return `<div class="${classes.join(' ')}" data-el-id="${el.id}" style="${elementStyleString(el, layout)}" ${motionAttr} role="img" aria-label="${Utils.esc(el.name)}">${elementInnerHTML(el)}</div>`;
}

/* ==========================================================================
 * 15. CANVAS EDITOR INTERACTIONS
 * ========================================================================== */
const EditorInteraction = (() => {
  let drag = null;
  function getCanvas(){ return document.getElementById('canvas'); }
  function getViewport(){ return document.getElementById('canvas-viewport'); }
  function currentScale(){ return Store.get().editor.zoom || 1; }

  function onPointerDown(e){
    const s = Store.get();
    if (s.editor.previewMode) return;
    if (s.activeView !== 'editor') return;
    const canvas = getCanvas(); if (!canvas) return;
    const handleEl = e.target.closest('[data-handle]');
    const elNode = e.target.closest('[data-el-id]');
    if (!elNode){
      if (!e.target.closest('.float-bar')) selectElement(null);
      return;
    }
    const elId = elNode.dataset.elId;
    const page = getActivePage(); if (!page) return;
    const el = page.elements.find(x => x.id === elId); if (!el) return;
    selectElement(elId);
    if (el.locked && !handleEl) return;
    const device = s.editor.device;
    const layout = getLayout(el, device);
    const scale = currentScale();
    drag = {
      id: elId, mode: handleEl ? 'resize' : 'move',
      dir: handleEl ? handleEl.dataset.handle : null,
      startX: e.clientX, startY: e.clientY,
      origin: Object.assign({}, layout),
      scale, moved: false, node: elNode
    };
    elNode.setPointerCapture?.(e.pointerId);
    e.preventDefault();
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);
  }

  function onPointerMove(e){
    if (!drag) return;
    const s = Store.get();
    const dx = (e.clientX - drag.startX) / drag.scale;
    const dy = (e.clientY - drag.startY) / drag.scale;
    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) drag.moved = true;
    const snapOn = s.settings.editor.snapping && !e.altKey;
    const grid = s.settings.editor.gridSize || GRID_SIZE;
    const snap = v => snapOn ? Math.round(v/grid)*grid : Math.round(v);
    let next = Object.assign({}, drag.origin);
    if (drag.mode === 'move'){
      next.x = snap(drag.origin.x + dx);
      next.y = snap(drag.origin.y + dy);
    } else {
      const dir = drag.dir;
      let { x, y, w, h } = drag.origin;
      const MIN = 20;
      if (dir.includes('e')) w = Math.max(MIN, snap(drag.origin.w + dx));
      if (dir.includes('s')) h = Math.max(4, snap(drag.origin.h + dy));
      if (dir.includes('w')){
        const nx = snap(drag.origin.x + dx);
        const nw = Math.max(MIN, drag.origin.w - (nx - drag.origin.x));
        x = drag.origin.x + (drag.origin.w - nw);
        w = nw;
      }
      if (dir.includes('n')){
        const ny = snap(drag.origin.y + dy);
        const nh = Math.max(4, drag.origin.h - (ny - drag.origin.y));
        y = drag.origin.y + (drag.origin.h - nh);
        h = nh;
      }
      next = { x, y, w, h };
    }
    drag.node.style.left = next.x + 'px';
    drag.node.style.top = next.y + 'px';
    drag.node.style.width = next.w + 'px';
    drag.node.style.height = next.h + 'px';
    drag.live = next;
    updateFloatingBar(next);
  }

  function onPointerUp(){
    window.removeEventListener('pointermove', onPointerMove);
    window.removeEventListener('pointerup', onPointerUp);
    window.removeEventListener('pointercancel', onPointerUp);
    if (!drag) return;
    const finished = drag; drag = null;
    if (!finished.moved || !finished.live) return;
    const page = getActivePage(); if (!page) return;
    const el = page.elements.find(x => x.id === finished.id); if (!el) return;
    const device = Store.get().editor.device;
    ['x','y','w','h'].forEach(k => setLayoutValue(el, device, k, Math.round(finished.live[k])));
    commitHistory('Move element');
    scheduleAutosave();
    renderInspector();
    renderShell();
  }

  function onDoubleClick(e){
    const s = Store.get();
    if (s.editor.previewMode) return;
    const elNode = e.target.closest('[data-el-id]'); if (!elNode) return;
    const page = getActivePage(); if (!page) return;
    const el = page.elements.find(x => x.id === elNode.dataset.elId); if (!el) return;
    if (el.locked){ Notify.warning('Element is locked', 'Unlock it from the Content tab to edit.'); return; }
    if (!['heading','text','button','badge','card'].includes(el.type)) return;
    const target = elNode.querySelector('.el-text') || elNode.querySelector('.el-btn') || elNode.querySelector('.el-inner > div:first-child');
    if (!target) return;
    target.setAttribute('contenteditable','true');
    target.style.outline = '2px solid rgba(77,163,255,.7)';
    target.style.outlineOffset = '4px';
    target.style.cursor = 'text';
    target.focus();
    try {
      const range = document.createRange();
      range.selectNodeContents(target);
      const sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(range);
    } catch(err){}
    const finish = () => {
      target.removeAttribute('contenteditable');
      target.style.outline = ''; target.style.outlineOffset = ''; target.style.cursor = '';
      const newText = target.textContent.trim();
      const field = el.type === 'card' ? 'title' : 'text';
      if (newText !== (el.props[field] || '')){
        el.props[field] = newText;
        commitHistory('Edit text');
        scheduleAutosave();
        renderInspector();
      }
      target.removeEventListener('blur', finish);
      target.removeEventListener('keydown', onKey);
    };
    const onKey = ev => {
      if (ev.key === 'Escape'){ ev.preventDefault(); target.blur(); }
      if (ev.key === 'Enter' && (el.type === 'button' || el.type === 'badge')){ ev.preventDefault(); target.blur(); }
    };
    target.addEventListener('blur', finish);
    target.addEventListener('keydown', onKey);
  }

  function attach(){
    const viewport = getViewport();
    if (viewport && !viewport.dataset.bound){
      viewport.dataset.bound = '1';
      viewport.addEventListener('pointerdown', onPointerDown);
      viewport.addEventListener('dblclick', onDoubleClick);
    }
  }
  return { attach, currentScale };
})();

function updateFloatingBar(liveLayout){
  const canvas = document.getElementById('canvas'); if (!canvas) return;
  canvas.querySelector('.float-bar')?.remove();
  canvas.querySelectorAll('.handle').forEach(h => h.remove());
  const s = Store.get();
  if (s.editor.previewMode) return;
  const el = getSelectedElement(); if (!el) return;
  const node = canvas.querySelector(`[data-el-id="${el.id}"]`); if (!node) return;
  const layout = liveLayout || getLayout(el, s.editor.device);

  ['nw','n','ne','e','se','s','sw','w'].forEach(dir => {
    const h = document.createElement('div');
    h.className = 'handle'; h.dataset.handle = dir; h.setAttribute('aria-hidden','true');
    node.appendChild(h);
  });

  const bar = document.createElement('div');
  bar.className = 'float-bar';
  bar.style.left = (layout.x + layout.w/2) + 'px';
  bar.style.top = Math.max(0, layout.y - 12) + 'px';
  bar.innerHTML = `
    <span class="float-tag">${Utils.esc(el.name)}</span>
    <div class="fb-sep"></div>
    <button data-fb="duplicate" title="Duplicate">${svg('copy')}</button>
    <button data-fb="front" title="Bring to front">${svg('bringFwd')}</button>
    <button data-fb="back" title="Send to back">${svg('sendBack')}</button>
    <button data-fb="visible" title="Toggle visibility">${svg(el.visible===false?'eyeOff':'eye')}</button>
    <button data-fb="lock" title="Toggle lock">${svg(el.locked?'lock':'unlock')}</button>
    <div class="fb-sep"></div>
    <button data-fb="delete" class="danger" title="Delete">${svg('trash')}</button>`;
  function svg(name){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name]}</svg>`; }
  bar.addEventListener('pointerdown', e => e.stopPropagation());
  bar.addEventListener('click', e => {
    const btn = e.target.closest('[data-fb]'); if (!btn) return;
    e.stopPropagation();
    const action = btn.dataset.fb;
    if (action === 'duplicate') Actions['duplicate-element']();
    else if (action === 'front') Actions['z-order'](null, { dataset:{ mode:'front' } });
    else if (action === 'back') Actions['z-order'](null, { dataset:{ mode:'back' } });
    else if (action === 'visible') toggleVisibility();
    else if (action === 'lock') toggleLock();
    else if (action === 'delete') Actions['delete-element']();
  });
  canvas.appendChild(bar);
}

function toggleVisibility(){
  const el = getSelectedElement(); if (!el) return;
  el.visible = el.visible === false;
  commitHistory('Toggle visibility');
  scheduleAutosave();
  rerenderCanvas();
  renderInspector();
}
function toggleLock(){
  const el = getSelectedElement(); if (!el) return;
  el.locked = !el.locked;
  commitHistory('Toggle lock');
  scheduleAutosave();
  rerenderCanvas();
  renderInspector();
}

let autosaveTimer = null;
function scheduleAutosave(){
  const s = Store.get();
  if (!s.settings.editor.autosave) return;
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => saveToStorage(true), AUTOSAVE_MS);
}
function commitHistory(label){
  const project = getActiveProject(); if (!project) return;
  History.commit(project, label);
  updateHistoryButtons();
}
function updateHistoryButtons(){
  const u = document.getElementById('btn-undo'), r = document.getElementById('btn-redo');
  if (u) u.disabled = !History.canUndo();
  if (r) r.disabled = !History.canRedo();
}
function rerenderCanvas(){
  const canvas = document.getElementById('canvas'); if (!canvas) return;
  const page = getActivePage(); if (!page) return;
  const s = Store.get();
  canvas.querySelectorAll('.canvas-el, .float-bar, .handle').forEach(n => n.remove());
  canvas.insertAdjacentHTML('afterbegin', page.elements.map(el => elementHTML(el, s.editor.device, s)).join(''));
  updateFloatingBar();
}
function selectElement(id){
  if (Store.get().selectedElementId === id) return;
  Store.patch('selectedElementId', id);
  rerenderCanvas();
  renderInspector();
}
function ScrollToElement(id){
  const canvas = document.getElementById('canvas');
  const viewport = document.getElementById('canvas-viewport');
  if (!canvas || !viewport) return;
  const node = canvas.querySelector(`[data-el-id="${id}"]`); if (!node) return;
  const nodeTop = parseFloat(node.style.top) || 0;
  const zoom = Store.get().editor.zoom || 1;
  viewport.scrollTo({ top: Math.max(0, nodeTop*zoom - 120), behavior:'smooth' });
}
function openProject(id){
  const s = Store.get();
  const project = s.projects.find(p => p.id === id); if (!project) return;
  Store.patch('activeProjectId', id);
  const firstPage = project.pages[0];
  Store.patch('activePageId', firstPage ? firstPage.id : null);
  Store.patch('selectedElementId', null);
  Store.patch('workspace', Object.assign({}, s.workspace, { openFileIds:[], activeFileId:null, previewFileId:null }));
  History.reset(project);
  updateHistoryButtons();
  saveToStorage(true);
  renderShell();
}
function openPage(id){
  Store.patch('activePageId', id);
  Store.patch('selectedElementId', null);
  saveToStorage(true);
  renderCurrentView();
  EditorInteraction.attach();
}
function applyHistorySnapshot(snap){
  const s = Store.get();
  const idx = s.projects.findIndex(p => p.id === snap.id);
  if (idx === -1) return;
  const projects = s.projects.slice();
  projects[idx] = snap;
  Store.patch('projects', projects);
  const stillExists = snap.pages.some(pg => pg.id === Store.get().activePageId && pg.elements.some(e => e.id === Store.get().selectedElementId));
  if (!stillExists) Store.patch('selectedElementId', null);
  updateHistoryButtons();
  saveToStorage(true);
  renderCurrentView();
  EditorInteraction.attach();
  renderShell();
}
function addElement(type){
  const page = getActivePage(); if (!page){ Notify.warning('No page open', 'Open a project first.'); return; }
  const baseY = page.elements.reduce((m,e) => Math.max(m, e.layout.desktop.y + e.layout.desktop.h), 0) + 40;
  const el = createElementOfType(type, 80, baseY);
  el.z = page.elements.length + 1;
  page.elements.push(el);
  page.height = Math.max(page.height, baseY + 260);
  Store.patch('selectedElementId', el.id);
  commitHistory('Add element');
  scheduleAutosave();
  rerenderCanvas();
  renderInspector();
  renderShell();
  Notify.success('Element added', el.name);
}
function applyZoom(){
  const s = Store.get();
  const stage = document.getElementById('canvas-stage');
  const label = document.getElementById('zoom-label');
  if (stage) stage.style.transform = `scale(${s.editor.zoom})`;
  if (label) label.textContent = Math.round(s.editor.zoom*100) + '%';
}
function fitCanvas(notify){
  const viewport = document.getElementById('canvas-viewport');
  const stage = document.getElementById('canvas-stage');
  if (!viewport || !stage) return;
  const s = Store.get();
  const device = s.editor.device;
  const canvasWidth = DEVICE_WIDTHS[device];
  const available = viewport.clientWidth - 68;
  let zoom = available / canvasWidth;
  zoom = Utils.clamp(zoom, 0.2, 1);
  Store.patch('editor', Object.assign({}, s.editor, { zoom, autoFit:true }));
  applyZoom();
  if (notify) Notify.info('Zoom fitted', `${Math.round(zoom*100)}% for ${DEVICE_LABELS[device]}`);
}
