function showContextMenu(anchorRect, items){
  document.querySelectorAll('.ctx-menu').forEach(m => m.remove());
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.style.cssText = `
    position:fixed; z-index:9400; min-width:190px; padding:6px;
    border-radius:14px; background:rgba(14,17,28,.97);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 24px 60px -18px rgba(0,0,0,.95);
    animation:modalIn .18s cubic-bezier(.16,1,.3,1);`;
  items.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'palette-item';
    btn.style.cssText = 'padding:8px 10px;width:100%';
    btn.innerHTML = `
      <span class="palette-icon" style="width:26px;height:26px">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[item.icon] || ICON_PATHS.plus}</svg>
      </span>
      <span class="palette-text"><span class="palette-title">${Utils.esc(item.label)}</span></span>`;
    btn.addEventListener('click', () => { menu.remove(); item.run(); });
    menu.appendChild(btn);
  });
  document.body.appendChild(menu);
  const rect = menu.getBoundingClientRect();
  let left = anchorRect.left;
  let top = (anchorRect.bottom || anchorRect.top) + 8;
  if (left + rect.width > window.innerWidth - 12) left = window.innerWidth - rect.width - 12;
  if (top + rect.height > window.innerHeight - 12) top = anchorRect.top - rect.height - 8;
  menu.style.left = Math.max(12, left) + 'px';
  menu.style.top = Math.max(12, top) + 'px';
  setTimeout(() => {
    const close = ev => {
      if (!menu.contains(ev.target)){ menu.remove(); document.removeEventListener('pointerdown', close, true); }
    };
    document.addEventListener('pointerdown', close, true);
  }, 10);
}

/* ==========================================================================
 * 17. FILE SYSTEM LAYER
 * --------------------------------------------------------------------------
 * FileTypes      — MIME/extension registry
 * FileDetector   — classify any input
 * VFS            — virtual file tree backed by project.files
 * ZipService     — read & write ZIP archives in-browser
 * FileProcessingManager — queue with progress + cancel
 * UniversalImporter — takes File objects / dataTransfer, produces VFS nodes
 * ExportCenter   — export in many formats
 * ConversionService — safe browser-only conversions
 * ========================================================================== */

const FileTypes = (() => {
  /* Each entry:
     - extensions: array of lowercase extensions
     - mime:       canonical mime type
     - category:   'text'|'code'|'markup'|'data'|'image'|'video'|'audio'|'archive'|'font'|'binary'
     - editable:   can be edited as text in-app
     - preview:    can be previewed
     - icon:       icon name
  */
  const TABLE = [
    // ---- Web markup ----
    { extensions:['html','htm'],          mime:'text/html',             category:'markup', editable:true, preview:true, icon:'fileCode' },
    { extensions:['css'],                  mime:'text/css',              category:'code',   editable:true, preview:true, icon:'fileCode' },
    { extensions:['scss','sass','less'],   mime:'text/x-scss',           category:'code',   editable:true, preview:false, icon:'fileCode' },
    { extensions:['js','mjs','cjs'],       mime:'text/javascript',       category:'code',   editable:true, preview:false, icon:'fileCode' },
    { extensions:['ts'],                   mime:'text/typescript',       category:'code',   editable:true, preview:false, icon:'fileCode' },
    { extensions:['jsx','tsx'],            mime:'text/jsx',              category:'code',   editable:true, preview:false, icon:'fileCode' },
    { extensions:['vue','svelte'],         mime:'text/x-vue',            category:'code',   editable:true, preview:false, icon:'fileCode' },
    { extensions:['xml'],                  mime:'application/xml',       category:'data',   editable:true, preview:false, icon:'fileCode' },
    { extensions:['svg'],                  mime:'image/svg+xml',         category:'image',  editable:true, preview:true,  icon:'fileImage' },
    // ---- Data / config ----
    { extensions:['json','jsonc'],         mime:'application/json',      category:'data',   editable:true, preview:false, icon:'fileJson' },
    { extensions:['yaml','yml'],           mime:'text/yaml',             category:'data',   editable:true, preview:false, icon:'fileJson' },
    { extensions:['csv','tsv'],            mime:'text/csv',              category:'data',   editable:true, preview:true,  icon:'csv' },
    { extensions:['toml'],                 mime:'text/toml',             category:'data',   editable:true, preview:false, icon:'fileJson' },
    { extensions:['ini','conf','cfg','env'], mime:'text/plain',          category:'data',   editable:true, preview:false, icon:'fileJson' },
    { extensions:['lock'],                 mime:'text/plain',            category:'data',   editable:true, preview:false, icon:'fileText' },
    // ---- Documents ----
    { extensions:['txt','text','log'],     mime:'text/plain',            category:'text',   editable:true, preview:false, icon:'fileText' },
    { extensions:['md','markdown'],        mime:'text/markdown',         category:'text',   editable:true, preview:true,  icon:'markdown' },
    { extensions:['rtf'],                  mime:'application/rtf',        category:'text',   editable:false, preview:false, icon:'fileText' },
    // ---- Images ----
    { extensions:['jpg','jpeg'],           mime:'image/jpeg',            category:'image',  editable:false, preview:true,  icon:'fileImage' },
    { extensions:['png'],                  mime:'image/png',             category:'image',  editable:false, preview:true,  icon:'fileImage' },
    { extensions:['webp'],                 mime:'image/webp',            category:'image',  editable:false, preview:true,  icon:'fileImage' },
    { extensions:['gif'],                  mime:'image/gif',             category:'image',  editable:false, preview:true,  icon:'fileImage' },
    { extensions:['avif'],                 mime:'image/avif',            category:'image',  editable:false, preview:true,  icon:'fileImage' },
    { extensions:['bmp'],                  mime:'image/bmp',             category:'image',  editable:false, preview:true,  icon:'fileImage' },
    { extensions:['ico'],                  mime:'image/x-icon',          category:'image',  editable:false, preview:true,  icon:'fileImage' },
    // ---- Video ----
    { extensions:['mp4','m4v'],            mime:'video/mp4',             category:'video',  editable:false, preview:true,  icon:'fileVideo' },
    { extensions:['webm'],                 mime:'video/webm',            category:'video',  editable:false, preview:true,  icon:'fileVideo' },
    { extensions:['mov'],                  mime:'video/quicktime',       category:'video',  editable:false, preview:true,  icon:'fileVideo' },
    { extensions:['ogv'],                  mime:'video/ogg',             category:'video',  editable:false, preview:true,  icon:'fileVideo' },
    // ---- Audio ----
    { extensions:['mp3'],                  mime:'audio/mpeg',            category:'audio',  editable:false, preview:true,  icon:'fileAudio' },
    { extensions:['wav'],                  mime:'audio/wav',             category:'audio',  editable:false, preview:true,  icon:'fileAudio' },
    { extensions:['ogg','oga'],            mime:'audio/ogg',             category:'audio',  editable:false, preview:true,  icon:'fileAudio' },
    { extensions:['m4a','aac'],            mime:'audio/mp4',             category:'audio',  editable:false, preview:true,  icon:'fileAudio' },
    { extensions:['flac'],                 mime:'audio/flac',            category:'audio',  editable:false, preview:true,  icon:'fileAudio' },
    // ---- Archives ----
    { extensions:['zip'],                  mime:'application/zip',       category:'archive',editable:false, preview:false, icon:'fileZip' },
    // ---- Fonts ----
    { extensions:['woff'],                 mime:'font/woff',             category:'font',   editable:false, preview:false, icon:'file' },
    { extensions:['woff2'],                mime:'font/woff2',            category:'font',   editable:false, preview:false, icon:'file' },
    { extensions:['ttf'],                  mime:'font/ttf',              category:'font',   editable:false, preview:false, icon:'file' },
    { extensions:['otf'],                  mime:'font/otf',              category:'font',   editable:false, preview:false, icon:'file' },
    // ---- Other ----
    { extensions:['pdf'],                  mime:'application/pdf',       category:'binary', editable:false, preview:false, icon:'file' },
    { extensions:['wasm'],                 mime:'application/wasm',      category:'binary', editable:false, preview:false, icon:'file' }
  ];

  const byExtension = new Map();
  const byMime = new Map();
  TABLE.forEach(def => {
    def.extensions.forEach(ext => byExtension.set(ext, def));
    if (!byMime.has(def.mime)) byMime.set(def.mime, def);
  });

  function extensionOf(filename){
    const base = String(filename||'').split(/[?#]/)[0];
    const dot = base.lastIndexOf('.');
    if (dot < 0 || dot === base.length - 1) return '';
    return base.slice(dot+1).toLowerCase();
  }
  function baseName(filename){
    const parts = String(filename||'').split('/');
    return parts[parts.length-1] || filename;
  }
  function dirName(path){
    const parts = String(path||'').split('/');
    parts.pop();
    return parts.join('/');
  }
  function lookup(filename, mime){
    const ext = extensionOf(filename);
    if (ext && byExtension.has(ext)) return byExtension.get(ext);
    if (mime && byMime.has(mime)) return byMime.get(mime);
    return null;
  }
  function isSupported(filename, mime){
    return Boolean(lookup(filename, mime));
  }
  function iconFor(filename, mime){
    const def = lookup(filename, mime);
    return def ? def.icon : 'file';
  }
  function categoryFor(filename, mime){
    const def = lookup(filename, mime);
    return def ? def.category : 'unknown';
  }
  function isEditable(filename, mime){
    const def = lookup(filename, mime);
    return def ? def.editable : false;
  }
  function isPreviewable(filename, mime){
    const def = lookup(filename, mime);
    return def ? def.preview : false;
  }
  function mimeFor(filename, mime){
    const def = lookup(filename, mime);
    return def ? def.mime : (mime || 'application/octet-stream');
  }
  return {
    TABLE, lookup, isSupported, iconFor, categoryFor,
    isEditable, isPreviewable, mimeFor,
    extensionOf, baseName, dirName
  };
})();

/** Virtual File System – operates on project.files array. */
const VFS = (() => {
  function getProject(){ return getActiveProject(); }
  function files(){ const p = getProject(); return (p && p.files) || []; }
  function find(id){ return files().find(f => f.id === id) || null; }
  function findByName(name){ return files().find(f => f.name === name || f.path === name) || null; }

  /** Build a nested tree from the flat file list. */
  function buildTree(){
    const root = { name:'', type:'folder', path:'', children:[], open:true };
    const map = new Map();
    map.set('', root);
    const ensureFolder = (path) => {
      if (map.has(path)) return map.get(path);
      const parts = path.split('/');
      let cur = root, cum = '';
      for (let i=0;i<parts.length;i++){
        cum = cum ? cum + '/' + parts[i] : parts[i];
        if (!map.has(cum)){
          const node = { name: parts[i], type:'folder', path:cum, children:[], open:true };
          map.set(cum, node);
          cur.children.push(node);
        }
        cur = map.get(cum);
      }
      return cur;
    };
    files().forEach(f => {
      const folder = ensureFolder(FileTypes.dirName(f.path));
      folder.children.push({
        name: FileTypes.baseName(f.path),
        type:'file', path:f.path,
        id:f.id, mime:f.mime, size:f.size, file:f
      });
    });
    // Sort: folders first, then alphabetical
    const sortNode = n => {
      if (!n.children) return;
      n.children.sort((a,b) => {
        if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
        return a.name.localeCompare(b.name);
      });
      n.children.forEach(sortNode);
    };
    sortNode(root);
    return root;
  }

  function uniquePath(path){
    let name = path, i = 1;
    while (files().some(f => f.path === name)){
      const dot = path.lastIndexOf('.');
      if (dot > 0) name = path.slice(0, dot) + ' (' + i + ')' + path.slice(dot);
      else name = path + ' (' + i + ')';
      i++;
    }
    return name;
  }

  function addFile(fileRecord){
    const project = getProject();
    if (!project) return null;
    if (!project.files) project.files = [];
    project.files.push(fileRecord);
    return fileRecord;
  }

  function removeFile(id){
    const project = getProject(); if (!project || !project.files) return;
    project.files = project.files.filter(f => f.id !== id);
  }

  function renameFile(id, newName){
    const f = find(id); if (!f) return;
    const folder = FileTypes.dirName(f.path);
    const base = Utils.slugify(newName) + (FileTypes.extensionOf(newName) ? '' : '');
    const ext = FileTypes.extensionOf(newName);
    const finalBase = ext ? newName : base;
    f.path = uniquePath(folder ? folder + '/' + finalBase : finalBase);
    f.name = FileTypes.baseName(f.path);
  }

  function mkdir(path){
    const project = getProject(); if (!project) return;
    if (!project.folders) project.folders = [];
    if (!project.folders.includes(path)) project.folders.push(path);
  }

  function folders(){
    const project = getProject();
    const set = new Set(project?.folders || []);
    files().forEach(f => {
      const parts = f.path.split('/');
      let cum = '';
      for (let i=0;i<parts.length-1;i++){
        cum = cum ? cum + '/' + parts[i] : parts[i];
        set.add(cum);
      }
    });
    return Array.from(set);
  }

  return { files, find, findByName, buildTree, addFile, removeFile, renameFile, mkdir, folders, uniquePath };
})();

/* ---------- ZIP service (uses browser Compression/DecompressionStream) ---------- */
const ZipService = (() => {
  let _crcTable = null;
  function crcTable(){
    if (_crcTable) return _crcTable;
    _crcTable = new Uint32Array(256);
    for (let i=0;i<256;i++){
      let c = i;
      for (let k=0;k<8;k++) c = (c & 1) ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      _crcTable[i] = c >>> 0;
    }
    return _crcTable;
  }
  function crc32(data){
    const t = crcTable();
    let crc = 0xFFFFFFFF;
    for (let i=0;i<data.length;i++) crc = t[(crc ^ data[i]) & 0xFF] ^ (crc >>> 8);
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  async function deflateRaw(data){
    if (typeof CompressionStream === 'undefined'){
      throw new Error('Browser does not support CompressionStream.');
    }
    const cs = new CompressionStream('deflate-raw');
    const writer = cs.writable.getWriter();
    writer.write(data); writer.close();
    const reader = cs.readable.getReader();
    const chunks = []; let total = 0;
    while (true){
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); total += value.length;
    }
    const out = new Uint8Array(total);
    let off = 0;
    for (const c of chunks){ out.set(c, off); off += c.length; }
    return out;
  }
  async function inflateRaw(data){
    if (typeof DecompressionStream === 'undefined'){
      throw new Error('Browser does not support DecompressionStream.');
    }
    const ds = new DecompressionStream('deflate-raw');
    const writer = ds.writable.getWriter();
    writer.write(data); writer.close();
    const reader = ds.readable.getReader();
    const chunks = []; let total = 0;
    while (true){
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); total += value.length;
    }
    const out = new Uint8Array(total);
    let off = 0;
    for (const c of chunks){ out.set(c, off); off += c.length; }
    return out;
  }

  /** Read a ZIP file into [{name, data: Uint8Array}]. */
  async function readZip(arrayBuffer){
    const view = new DataView(arrayBuffer);
    const bytes = new Uint8Array(arrayBuffer);
    // Find End Of Central Directory
    let eocd = -1;
    const minPos = Math.max(0, arrayBuffer.byteLength - 65558);
    for (let i = arrayBuffer.byteLength - 22; i >= minPos; i--){
      if (view.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
    }
    if (eocd < 0) throw new Error('Not a valid ZIP archive.');
    const totalEntries = view.getUint16(eocd + 10, true);
    const cdOffset = view.getUint32(eocd + 16, true);

    const out = [];
    let ptr = cdOffset;
    for (let i=0;i<totalEntries;i++){
      if (view.getUint32(ptr, true) !== 0x02014b50) break;
      const method = view.getUint16(ptr + 10, true);
      const compSize = view.getUint32(ptr + 20, true);
      const nameLen = view.getUint16(ptr + 28, true);
      const extraLen = view.getUint16(ptr + 30, true);
      const commentLen = view.getUint16(ptr + 32, true);
      const localOffset = view.getUint32(ptr + 42, true);
      const name = new TextDecoder('utf-8').decode(bytes.slice(ptr + 46, ptr + 46 + nameLen));
      // Read local header to find data start
      const lNameLen = view.getUint16(localOffset + 26, true);
      const lExtraLen = view.getUint16(localOffset + 28, true);
      const dataStart = localOffset + 30 + lNameLen + lExtraLen;
      const compressed = bytes.slice(dataStart, dataStart + compSize);
      if (!name.endsWith('/')){
        let data;
        if (method === 0) data = compressed;
        else if (method === 8) data = await inflateRaw(compressed);
        else throw new Error(`Unsupported ZIP compression method ${method} for ${name}`);
        out.push({ name, data });
      }
      ptr += 46 + nameLen + extraLen + commentLen;
    }
    return out;
  }

  /** Build a ZIP from [{name, data: Uint8Array}] → Uint8Array. */
  async function writeZip(files){
    const encoder = new TextEncoder();
    const parts = []; const central = [];
    let offset = 0;
    for (const f of files){
      const nameBytes = encoder.encode(f.name);
      const crc = crc32(f.data);
      let compressed, method;
      try {
        compressed = await deflateRaw(f.data);
        method = compressed.length < f.data.length ? 8 : 0;
      } catch(e){
        compressed = f.data; method = 0;
      }
      const dataToWrite = method === 8 ? compressed : f.data;
      const localHeader = new Uint8Array(30 + nameBytes.length);
      const lv = new DataView(localHeader.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0, true);
      lv.setUint16(8, method, true);
      lv.setUint16(10, 0, true);
      lv.setUint16(12, 0, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, dataToWrite.length, true);
      lv.setUint32(22, f.data.length, true);
      lv.setUint16(26, nameBytes.length, true);
      lv.setUint16(28, 0, true);
      localHeader.set(nameBytes, 30);
      parts.push(localHeader, dataToWrite);
      // Central directory entry
      const cd = new Uint8Array(46 + nameBytes.length);
      const cv = new DataView(cd.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0, true);
      cv.setUint16(10, method, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, dataToWrite.length, true);
      cv.setUint32(24, f.data.length, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint32(42, offset, true);
      cd.set(nameBytes, 46);
      central.push(cd);
      offset += localHeader.length + dataToWrite.length;
    }
    const cdStart = offset;
    for (const c of central){ parts.push(c); offset += c.length; }
    const eocd = new Uint8Array(22);
    const ev = new DataView(eocd.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, offset - cdStart, true);
    ev.setUint32(16, cdStart, true);
    parts.push(eocd);
    let totalLen = 0;
    for (const p of parts) totalLen += p.length;
    const out = new Uint8Array(totalLen);
    let off = 0;
    for (const p of parts){ out.set(p, off); off += p.length; }
    return out;
  }

  return { readZip, writeZip, crc32 };
})();

/* ---------- File processing queue ---------- */
const FileProcessingManager = (() => {
  const queue = new Map(); // id -> {id, name, status, progress, error, onCancel}
  const listeners = new Set();

  function notify(){
    listeners.forEach(fn => { try { fn(); } catch(e){} });
  }
  function add(name, onCancel){
    const id = Utils.uid('job');
    queue.set(id, { id, name, status:'queued', progress:0, error:null, onCancel });
    notify();
    return id;
  }
  function update(id, patch){
    const j = queue.get(id); if (!j) return;
    Object.assign(j, patch);
    notify();
  }
  function cancel(id){
    const j = queue.get(id); if (!j) return;
    if (j.onCancel){ try { j.onCancel(); } catch(e){} }
    j.status = 'cancelled';
    notify();
    setTimeout(() => { queue.delete(id); notify(); }, 2400);
  }
  function remove(id){ queue.delete(id); notify(); }
  function all(){ return Array.from(queue.values()); }
  function clear(){ queue.clear(); notify(); }
  function subscribe(fn){ listeners.add(fn); return () => listeners.delete(fn); }

  return { add, update, cancel, remove, all, clear, subscribe };
})();

/* ---------- Universal Importer ---------- */
const UniversalImporter = (() => {

  /** Convert any File into a VFS record (async). */
  async function makeRecord(file, pathOverride, jobId){
    const name = pathOverride || file.name;
    const ext = FileTypes.extensionOf(name);
    const mime = file.type || FileTypes.mimeFor(name);
    const isText = FileTypes.isEditable(name, mime) ||
                   FileTypes.categoryFor(name, mime) === 'data' ||
                   FileTypes.categoryFor(name, mime) === 'code' ||
                   FileTypes.categoryFor(name, mime) === 'markup' ||
                   FileTypes.categoryFor(name, mime) === 'text';
    const record = {
      id: Utils.uid('file'),
      name: FileTypes.baseName(name),
      path: name,
      mime,
      size: file.size,
      ext,
      category: FileTypes.categoryFor(name, mime),
      createdAt: Date.now(),
      updatedAt: Date.now(),
      content: null,   // text
      dataUrl: null,   // for binary previews
      blob: null       // original Blob reference
    };

    if (FileTypes.categoryFor(name, mime) === 'archive' && ext === 'zip'){
      // ZIP is handled separately by the caller
      record.content = null;
      return record;
    }

    if (isText && file.size < 4 * 1024 * 1024){
      try {
        const text = await file.text();
        record.content = text;
      } catch(e){ record.content = ''; }
    } else if (FileTypes.isPreviewable(name, mime)){
      // Keep a Blob reference (used for img/video/audio src). We avoid base64
      // for large media to keep memory reasonable; object URLs are created on demand.
      record.blob = file;
    } else {
      record.blob = file;
    }

    if (jobId) FileProcessingManager.update(jobId, { progress: 100 });
    return record;
  }

  /** Import a list of File objects into the active project. */
  async function importFiles(files){
    const project = getActiveProject();
    if (!project){ Notify.warning('No project open', 'Open or create a project first.'); return; }
    if (!project.files) project.files = [];

    const jobId = FileProcessingManager.add(`Importing ${files.length} file${files.length===1?'':'s'}`);
    FileProcessingManager.update(jobId, { status:'processing' });

    const stats = { imported:0, skipped:0, failed:0, byCategory:{}, totalSize:0 };
    const pending = [];

    try {
      let processed = 0;
      for (const file of files){
        const name = file.webkitRelativePath || file.name;
        if (FileTypes.extensionOf(name) === 'zip'){
          try {
            const buf = await file.arrayBuffer();
            const entries = await ZipService.readZip(buf);
            for (const entry of entries){
              const rec = await makeRecordFromBytes(entry.name, entry.data);
              pending.push(rec);
              stats.byCategory[rec.category] = (stats.byCategory[rec.category]||0) + 1;
              stats.totalSize += rec.size;
            }
            stats.imported += entries.length;
          } catch(err){
            stats.failed++;
            console.warn('[Zip import failed]', err);
          }
        } else if (FileTypes.isSupported(name, file.type)){
          try {
            const rec = await makeRecord(file);
            if (!rec) { stats.skipped++; continue; }
            pending.push(rec);
            stats.byCategory[rec.category] = (stats.byCategory[rec.category]||0) + 1;
            stats.totalSize += rec.size;
            stats.imported++;
          } catch(err){
            stats.failed++;
          }
        } else {
          stats.skipped++;
        }
        processed++;
        FileProcessingManager.update(jobId, { progress: Math.round(processed / files.length * 100) });
        // Yield to keep UI responsive
        if (processed % 4 === 0) await Utils.delay(0);
      }

      // Detect duplicate paths → keep both
      const renameMap = new Map();
      pending.forEach(rec => {
        const basePath = rec.path;
        const existing = project.files.find(f => f.path === basePath);
        if (existing){
          const folder = FileTypes.dirName(basePath);
          const base = FileTypes.baseName(basePath);
          const ext = FileTypes.extensionOf(base);
          const stem = ext ? base.slice(0, -(ext.length+1)) : base;
          const newBase = stem + ' (' + (renameMap.get(basePath) || 2) + ')' + (ext ? '.' + ext : '');
          renameMap.set(basePath, (renameMap.get(basePath) || 2) + 1);
          rec.path = folder ? folder + '/' + newBase : newBase;
          rec.name = newBase;
        }
        project.files.push(rec);
      });

      project.updatedAt = Date.now();

      FileProcessingManager.update(jobId, { status:'done', progress:100 });
      setTimeout(() => FileProcessingManager.remove(jobId), 2400);

      saveToStorage(true);
      logActivity('import', `Imported ${stats.imported} file${stats.imported===1?'':'s'} into “${project.name}”`);

      // Show the import result summary
      showImportSummary(stats);

      if (getActiveProject() && getActiveProject().id === project.id){
        if (Store.get().activeView === 'workspace') renderWorkspace();
        renderShell();
      }
    } catch(err){
      console.error('[Import failed]', err);
      FileProcessingManager.update(jobId, { status:'failed', error: err.message || 'Import failed' });
      setTimeout(() => FileProcessingManager.remove(jobId), 3200);
      Notify.error('Import failed', err.message || 'Something went wrong.');
    }
  }

  /** Import bytes (used from ZIP entries and drag-drop of folders). */
  async function makeRecordFromBytes(name, data){
    const ext = FileTypes.extensionOf(name);
    const mime = FileTypes.mimeFor(name);
    const isText = FileTypes.isEditable(name, mime) ||
                   ['data','code','markup','text'].includes(FileTypes.categoryFor(name, mime));
    const record = {
      id: Utils.uid('file'),
      name: FileTypes.baseName(name),
      path: name,
      mime,
      size: data.byteLength,
      ext,
      category: FileTypes.categoryFor(name, mime),
      createdAt: Date.now(),
      updatedAt: Date.now(),
      content: null,
      dataUrl: null,
      blob: null
    };
    if (isText && data.byteLength < 4 * 1024 * 1024){
      try { record.content = new TextDecoder('utf-8').decode(data); }
      catch(e){ record.content = ''; }
    } else if (FileTypes.isPreviewable(name, mime)){
      // Convert to Blob for object URL
      record.blob = new Blob([data], { type: mime });
    } else {
      record.blob = new Blob([data], { type: mime });
    }
    return record;
  }

  /** Recursive directory-entry walker (webkitdirectory / DataTransferItem). */
  async function collectFilesFromDataTransfer(dataTransfer){
    const files = [];
    const items = dataTransfer.items;
    if (!items) return Array.from(dataTransfer.files || []);

    const entries = [];
    for (let i=0;i<items.length;i++){
      const item = items[i];
      if (item.kind !== 'file') continue;
      const entry = item.webkitGetAsEntry && item.webkitGetAsEntry();
      if (entry) entries.push(entry);
      else {
        const f = item.getAsFile();
        if (f) files.push(f);
      }
    }

    async function walk(entry, prefix){
      if (entry.isFile){
        const f = await new Promise((res, rej) => entry.file(res, rej));
        // Preserve relative path
        try { Object.defineProperty(f, 'webkitRelativePath', { value: prefix + entry.name }); } catch(e){}
        files.push(f);
      } else if (entry.isDirectory){
        const reader = entry.createReader();
        const readAll = () => new Promise((res) => reader.readEntries(res));
        let batch;
        do {
          batch = await readAll();
          for (const child of batch) await walk(child, prefix + entry.name + '/');
        } while (batch.length);
      }
    }
    for (const e of entries) await walk(e, '');
    return files;
  }

  function showImportSummary(stats){
    const total = stats.imported + stats.skipped + stats.failed;
    Modal.open({
      title:'Import complete',
      subtitle:`Processed ${total} item${total===1?'':'s'} from your drop.`,
      icon:'check',
      size:520,
      body: `
        <div class="import-stats">
          <div class="imp-stat"><div class="k">Imported</div><div class="v">${stats.imported}</div></div>
          <div class="imp-stat"><div class="k">Skipped</div><div class="v">${stats.skipped}</div></div>
          <div class="imp-stat"><div class="k">Failed</div><div class="v">${stats.failed}</div></div>
          <div class="imp-stat"><div class="k">Total size</div><div class="v" style="font-size:16px">${Utils.formatBytes(stats.totalSize)}</div></div>
        </div>
        ${Object.keys(stats.byCategory).length ? `
          <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:6px">
            ${Object.entries(stats.byCategory).map(([k,v]) =>
              `<span class="project-tag">${k}: ${v}</span>`).join('')}
          </div>` : ''}
        ${stats.skipped ? `<div class="notice" style="margin-top:12px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS.alert}</svg>
          <span>${stats.skipped} file${stats.skipped===1?'':'s'} skipped — format not supported. Supported: HTML, CSS, JS, JSON, XML, SVG, SCSS/LESS, Markdown, CSV, images, video, audio, ZIP and more.</span>
        </div>` : ''}`,
      actions: [
        { label:'Stay on Studio', variant:'ghost' },
        { label:'Open in Files', variant:'primary', onClick: (o,c) => {
          c();
          setView('workspace');
          setTimeout(() => Workspace.mount(), 40);
        }}
      ]
    });
  }

  return { importFiles, collectFilesFromDataTransfer, makeRecordFromBytes };
})();

/* ---------- Conversion service (browser-only, honest about limits) ---------- */
const ConversionService = {
  /** JSON ⇄ CSV — safe, purely local. */
  jsonToCsv(jsonText){
    try {
      const data = JSON.parse(jsonText);
      const arr = Array.isArray(data) ? data : [data];
      if (!arr.length) return '';
      const cols = Array.from(arr.reduce((set, row) => {
        Object.keys(row || {}).forEach(k => set.add(k));
        return set;
      }, new Set()));
      const escape = v => {
        if (v == null) return '';
        const s = typeof v === 'object' ? JSON.stringify(v) : String(v);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      };
      return [cols.join(','), ...arr.map(row => cols.map(c => escape(row[c])).join(','))].join('\n');
    } catch(e){ return ''; }
  },
  csvToJson(csvText){
    const lines = String(csvText||'').trim().split(/\r?\n/);
    if (!lines.length) return '[]';
    const parseRow = (line) => {
      const out = []; let cur = ''; let inQ = false;
      for (let i=0;i<line.length;i++){
        const ch = line[i];
        if (inQ){
          if (ch === '"' && line[i+1] === '"'){ cur += '"'; i++; }
          else if (ch === '"') inQ = false;
          else cur += ch;
        } else {
          if (ch === '"') inQ = true;
          else if (ch === ','){ out.push(cur); cur = ''; }
          else cur += ch;
        }
      }
      out.push(cur);
      return out;
    };
    const headers = parseRow(lines[0]);
    const rows = lines.slice(1).map(l => {
      const cells = parseRow(l);
      const row = {};
      headers.forEach((h,i) => { row[h] = cells[i] ?? ''; });
      return row;
    });
    return JSON.stringify(rows, null, 2);
  },
  markdownToHtml(mdText){
    return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Markdown</title>
<style>body{font:16px/1.6 system-ui,sans-serif;max-width:820px;margin:40px auto;padding:0 20px;color:#111}
pre{background:#f5f5f5;padding:14px;border-radius:8px;overflow:auto}code{background:#f0f0f0;padding:2px 5px;border-radius:4px}
blockquote{border-left:3px solid #ccc;margin:0;padding:0 14px;color:#555}</style></head>
<body>${Utils.renderMarkdown(mdText)}</body></html>`;
  },
  /** Assemble a single self-contained HTML from project files. */
  buildSingleHtml(project){
    if (!project) return null;
    const htmlFile = (project.files||[]).find(f => /\.html?$/i.test(f.path)) ||
                     (project.files||[]).find(f => f.category === 'markup');
    if (!htmlFile || !htmlFile.content){
      return { ok:false, reason:'No HTML file found in the project.' };
    }
    let html = htmlFile.content;
    const warnings = [];

    // Inline local CSS
    html = html.replace(/<link[^>]*href=["']([^"']+)["'][^>]*>/gi, (match, href) => {
      if (/^https?:|^\/\//i.test(href)) return match;
      const clean = href.replace(/^\.\//,'').split(/[?#]/)[0];
      const css = (project.files||[]).find(f => f.path === clean || f.path.endsWith('/' + clean));
      if (css && css.content != null) return `<style>\n${css.content}\n</style>`;
      warnings.push(`External CSS not found: ${href}`);
      return match;
    });
    // Inline local JS
    html = html.replace(/<script[^>]*src=["']([^"']+)["'][^>]*><\/script>/gi, (match, src) => {
      if (/^https?:|^\/\//i.test(src)) return match;
      const clean = src.replace(/^\.\//,'').split(/[?#]/)[0];
      const js = (project.files||[]).find(f => f.path === clean || f.path.endsWith('/' + clean));
      if (js && js.content != null) return `<script>\n${js.content}\n<\/script>`;
      warnings.push(`External script not found: ${src}`);
      return match;
    });
    // Inline images that are SVG or small enough
    const imgRegex = /(<img[^>]*src=["'])([^"']+)(["'][^>]*>)/gi;
    html = html.replace(imgRegex, (match, pre, src, post) => {
      if (/^https?:|^data:/.test(src)) return match;
      const clean = src.replace(/^\.\//,'').split(/[?#]/)[0];
      const img = (project.files||[]).find(f => f.path === clean || f.path.endsWith('/' + clean));
      if (!img) return match;
      if (img.content && /\.svg$/i.test(img.path)){
        const svgData = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(img.content)));
        return pre + svgData + post;
      }
      if (img.blob && img.blob.size < 200 * 1024){
        warnings.push(`Large binary ${img.path} was left external — inline size limit is 200 KB.`);
      } else if (img.blob){
        warnings.push(`Binary ${img.path} remains external (${Utils.formatBytes(img.blob.size)}).`);
      }
      return match;
    });

    return { ok:true, html, warnings };
  },
  /** Detect whether a conversion needs a backend. */
  requiresBackend(from, to){
    const matrix = {
      'image/webp': ['image/jpeg','image/png','image/gif','image/avif'],
      'application/pdf': ['*']
    };
    return Boolean(matrix[from] && (matrix[from].includes(to) || matrix[from].includes('*')));
  }
};

/* ---------- Export Center ---------- */
const ExportCenter = {
  /** Export the entire project as a ZIP archive. */
  async exportZip(projectArg){
    const project = projectArg || getActiveProject();
    if (!project){ Notify.warning('No project open', 'Open a project first.'); return; }
    const jobId = FileProcessingManager.add(`Packaging “${project.name}” as ZIP`);
    FileProcessingManager.update(jobId, { status:'processing', progress:10 });
    const toast = Notify.loading('Packaging project…', 'Building ZIP archive in your browser.');

    try {
      const entries = await this._collectProjectEntries(project);
      FileProcessingManager.update(jobId, { progress: 70 });
      const bytes = await ZipService.writeZip(entries);
      const filename = Utils.slugify(project.name) + '.zip';
      const blob = new Blob([bytes], { type:'application/zip' });
      const ok = Utils.downloadBlob(filename, blob);
      FileProcessingManager.update(jobId, { status:'done', progress:100 });
      setTimeout(() => FileProcessingManager.remove(jobId), 2400);
      if (ok){
        logActivity('export', `Exported “${project.name}” as ZIP`);
        Notify.update(toast.id, { title:'ZIP exported', message:`${entries.length} files · ${Utils.formatBytes(bytes.byteLength)}`, type:'success' });
        renderShell();
      } else {
        Notify.update(toast.id, { title:'Export blocked', message:'Your browser blocked the download.', type:'error' });
      }
    } catch(err){
      console.error(err);
      FileProcessingManager.update(jobId, { status:'failed', error: err.message });
      setTimeout(() => FileProcessingManager.remove(jobId), 3200);
      Notify.update(toast.id, { title:'Export failed', message: err.message || 'Unknown error.', type:'error' });
    }
  },

  /** Export a complete standalone website (same as ZIP but with a README). */
  async exportWebsite(projectArg){
    const project = projectArg || getActiveProject();
    if (!project){ Notify.warning('No project open', 'Open a project first.'); return; }
    const hasHtml = (project.files||[]).some(f => /\.html?$/i.test(f.path));
    if (!hasHtml){
      Notify.warning('No HTML entry point', 'This project has no .html file to anchor a website export.');
    }
    const jobId = FileProcessingManager.add(`Exporting website “${project.name}”`);
    FileProcessingManager.update(jobId, { status:'processing', progress:10 });
    const toast = Notify.loading('Building website…', 'Preserving the complete folder structure.');

    try {
      const entries = await this._collectProjectEntries(project);
      const readme = new TextEncoder().encode(
        `# ${project.name}\n\nExported from Nebula Studio on ${new Date().toISOString()}\n\n` +
        `Total files: ${entries.length}\n\n` +
        `## Structure\n\n` +
        entries.map(e => '  ' + e.name).join('\n') + '\n'
      );
      entries.push({ name: 'README.txt', data: readme });
      FileProcessingManager.update(jobId, { progress: 70 });
      const bytes = await ZipService.writeZip(entries);
      const blob = new Blob([bytes], { type:'application/zip' });
      const ok = Utils.downloadBlob(Utils.slugify(project.name) + '-website.zip', blob);
      FileProcessingManager.update(jobId, { status:'done', progress:100 });
      setTimeout(() => FileProcessingManager.remove(jobId), 2400);
      if (ok){
        logActivity('export', `Exported website “${project.name}”`);
        Notify.update(toast.id, { title:'Website exported', message:`Ready-to-serve bundle · ${Utils.formatBytes(bytes.byteLength)}`, type:'success' });
      } else Notify.update(toast.id, { title:'Export blocked', message:'Your browser blocked the download.', type:'error' });
    } catch(err){
      console.error(err);
      FileProcessingManager.update(jobId, { status:'failed', error: err.message });
      setTimeout(() => FileProcessingManager.remove(jobId), 3200);
      Notify.update(toast.id, { title:'Export failed', message: err.message || 'Unknown error.', type:'error' });
    }
  },

  /** Export a single self-contained HTML file where possible. */
  async exportSingleHtml(projectArg){
    const project = projectArg || getActiveProject();
    if (!project){ Notify.warning('No project open', 'Open a project first.'); return; }
    const toast = Notify.loading('Inlining assets…', 'Building a self-contained HTML file.');
    const result = ConversionService.buildSingleHtml(project);
    if (!result || !result.ok){
      Notify.update(toast.id, { title:'Cannot inline', message: result?.reason || 'No HTML entry point found.', type:'error' });
      return;
    }
    const blob = new Blob([result.html], { type:'text/html' });
    const ok = Utils.downloadBlob(Utils.slugify(project.name) + '.inline.html', blob);
    if (ok){
      const warnings = result.warnings.length ? ` ${result.warnings.length} asset warning${result.warnings.length===1?'':'s'}.` : '';
      Notify.update(toast.id, { title:'Single HTML exported', message:`Self-contained bundle ready.${warnings}`, type:'success' });
      logActivity('export', `Exported single HTML for “${project.name}”`);
    } else Notify.update(toast.id, { title:'Export blocked', message:'Your browser blocked the download.', type:'error' });
  },

  /** Export all editable text files concatenated for quick reference. */
  exportAllAsText(projectArg){
    const project = projectArg || getActiveProject();
    if (!project){ Notify.warning('No project open', 'Open a project first.'); return; }
    const parts = [`# ${project.name}\n`];
    (project.files||[]).forEach(f => {
      if (f.content != null){
        parts.push(`\n\n===== ${f.path} =====\n\n${f.content}`);
      }
    });
    if (parts.length === 1){ Notify.warning('Nothing to export', 'No text files in this project.'); return; }
    Utils.download(Utils.slugify(project.name) + '.txt', parts.join(''));
    Notify.success('Text export ready', 'All editable content written to one file.');
  },

  /** Export CSV of every editable data file. */
  exportCsv(projectArg){
    const project = projectArg || getActiveProject();
    if (!project){ Notify.warning('No project open', 'Open a project first.'); return; }
    const jsonFile = (project.files||[]).find(f => /\.json$/i.test(f.path) && f.content);
    if (!jsonFile){ Notify.warning('No JSON found', 'Export CSV works from a JSON file in the project.'); return; }
    const csv = ConversionService.jsonToCsv(jsonFile.content);
    if (!csv){ Notify.error('CSV conversion failed', 'The JSON structure could not be flattened.'); return; }
    Utils.download(Utils.slugify(project.name) + '.csv', csv);
    Notify.success('CSV exported', `Converted ${jsonFile.path} → CSV`);
    logActivity('export', `Exported CSV from ${jsonFile.path}`);
  },

  /** Export one file as its original binary. */
  exportFile(fileId){
    const f = VFS.find(fileId); if (!f) return;
    if (f.blob){
      Utils.downloadBlob(f.name, f.blob);
      Notify.success('File downloaded', f.name);
      return;
    }
    if (f.content != null){
      const mime = f.mime || 'text/plain';
      Utils.downloadBlob(f.name, new Blob([f.content], { type: mime }));
      Notify.success('File downloaded', f.name);
      return;
    }
    Notify.warning('No data available', 'This file was not stored locally.');
  },

  /** Bundle a project's files for archiving. */
  async _collectProjectEntries(project){
    const entries = [];
    const encoder = new TextEncoder();
    for (const f of (project.files || [])){
      if (f.content != null){
        entries.push({ name: f.path, data: encoder.encode(f.content) });
      } else if (f.blob){
        const buf = await f.blob.arrayBuffer();
        entries.push({ name: f.path, data: new Uint8Array(buf) });
      } else {
        entries.push({ name: f.path, data: new Uint8Array(0) });
      }
    }
    // Also include a JSON manifest of canvas pages so nothing is lost
    const manifest = {
      format: 'nebula-studio-canvas',
      version: APP_VERSION,
      project: { id: project.id, name: project.name, pages: project.pages }
    };
    entries.push({ name: '_nebula/canvas.json', data: encoder.encode(JSON.stringify(manifest, null, 2)) });
    // And a copy of the original project JSON (canvas + files metadata, without blobs)
    const meta = Utils.clone(project);
    (meta.files || []).forEach(f => { if (f.blob) delete f.blob; });
    entries.push({ name: '_nebula/project.json', data: encoder.encode(JSON.stringify(meta, null, 2)) });
    return entries;
  }
};

    ],
    onMount: (overlay, close) => {
      const renderQueue = () => {
        const box = overlay.querySelector('#import-queue');
        if (!box) return;
        const jobs = FileProcessingManager.all();
        if (!jobs.length){
          box.innerHTML = `<p style="color:var(--muted);font-size:12.5px;margin:0">Nothing in the queue. Files will appear here while importing.</p>`;
          return;
        }
        box.innerHTML = jobs.map(j => `
          <div class="queue-item ${j.status === 'done' ? 'done' : j.status === 'failed' ? 'failed' : ''}">
            <div class="qi-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${j.status === 'done' ? ICON_PATHS.check : j.status === 'failed' ? ICON_PATHS.alert : ICON_PATHS.refresh}</svg>
            </div>
            <div class="qi-body">
              <div class="qi-name">${Utils.esc(j.name)}</div>
              <div class="qi-sub">${j.status} · ${j.progress}%${j.error ? ' · ' + Utils.esc(j.error) : ''}</div>
              <div class="qi-progress"><span style="width:${j.progress}%"></span></div>
            </div>
            ${j.status === 'processing' || j.status === 'queued' ? `
              <button class="qi-cancel" data-cancel="${j.id}" aria-label="Cancel">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
              </button>` : ''}
          </div>`).join('');
        box.querySelectorAll('[data-cancel]').forEach(btn => {
          btn.addEventListener('click', () => FileProcessingManager.cancel(btn.dataset.cancel));
        });
      };
      const unsub = FileProcessingManager.subscribe(renderQueue);
      renderQueue();

      overlay.querySelectorAll('[data-modal-action]').forEach(btn => {
        const action = btn.dataset.modalAction;
        if (!action || !action.startsWith('pick-')) return;
        btn.addEventListener('click', () => {
          if (action === 'pick-files'){
            const input = document.getElementById('file-input');
            input.value = '';
            input.onchange = () => {
              const files = Array.from(input.files || []);
              if (files.length) UniversalImporter.importFiles(files);
            };
            input.click();
          } else if (action === 'pick-zip'){
            const input = document.getElementById('zip-input');
            input.value = '';
            input.onchange = () => {
              const files = Array.from(input.files || []);
              if (files.length) UniversalImporter.importFiles(files);
            };
            input.click();
          } else if (action === 'pick-folder'){
            const inp = document.createElement('input');
            inp.type = 'file';
            inp.multiple = true;
            inp.webkitdirectory = true;
            inp.onchange = () => {
              const files = Array.from(inp.files || []);
              if (files.length) UniversalImporter.importFiles(files);
            };
            inp.click();
          } else if (action === 'pick-json'){
            const inp = document.createElement('input');
            inp.type = 'file';
            inp.accept = '.json,.nebula.json,application/json';
            inp.onchange = () => {
              const file = (inp.files||[])[0]; if (!file) return;
              const reader = new FileReader();
              reader.onload = () => handleImport(String(reader.result));
              reader.readAsText(file);
            };
            inp.click();
          }
        });
      });

      // Detach when modal closes
      const obs = new MutationObserver(() => {
        if (!document.getElementById('modal-root')?.firstChild){
          obs.disconnect();
          unsub();
        }
      });
      obs.observe(document.getElementById('modal-root'), { childList:true });
    }
  });
}

const Workspace = (() => {
  let previewUrl = null;

  function getActiveFile(){
    const s = Store.get();
    if (!s.workspace.activeFileId) return null;
    return VFS.find(s.workspace.activeFileId);
  }

  function openFile(id){
    const s = Store.get();
    const openIds = s.workspace.openFileIds.slice();
    if (!openIds.includes(id)) openIds.push(id);
    Store.patch('workspace', Object.assign({}, s.workspace, { openFileIds: openIds, activeFileId: id }));
    renderWorkspaceBody();
  }
  function closeFile(id){
    const s = Store.get();
    const openIds = s.workspace.openFileIds.filter(x => x !== id);
    let active = s.workspace.activeFileId;
    if (active === id) active = openIds[openIds.length-1] || null;
    Store.patch('workspace', Object.assign({}, s.workspace, { openFileIds: openIds, activeFileId: active }));
    renderWorkspaceBody();
  }

  function mount(){
    const view = document.querySelector('.view[data-view="workspace"]');
    if (view) view.setAttribute('data-mounted', '1');
    renderWorkspace();
  }

  function renderWorkspace(){
    const view = document.querySelector('.view[data-view="workspace"]');
    if (!view) return;
    const project = getActiveProject();
    if (!project){
      view.innerHTML = `

    const s = Store.get();
    const files = project.files || [];
    const totalSize = files.reduce((a,f) => a + (f.size||0), 0);

    view.innerHTML = `
      <div class="workspace-shell">
        <div class="workspace-toolbar" role="toolbar" aria-label="Workspace toolbar">
          <div class="toolbar-group">

  function renderWorkspaceBody(){
    const body = document.getElementById('workspace-body');
    if (!body) return;
    const s = Store.get();
    const project = getActiveProject();
    const files = project ? (project.files||[]) : [];

    // File tree
    const treeHTML = renderFileTree();

    // Editor area
    const editorHTML = renderEditorArea();

    // Preview
    const previewHTML = s.workspace.previewOpen ? renderPreviewPane() : '';

    body.innerHTML = `
      <div class="file-tree${s.workspace.treeOpen ? ' open' : ''}" id="file-tree">
        <div class="tree-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS.folder}</svg>
          <span>Project files</span>
          <div class="tree-actions">
            <button data-action="workspace-new-file" title="New file">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button data-action="workspace-refresh" title="Refresh">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS.refresh}</svg>
            </button>
          </div>
        </div>
        <div class="tree-scroll" id="tree-scroll">
          ${files.length ? treeHTML : `
            <div style="padding:30px 16px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6">

              <button class="btn ghost sm" data-action="open-import" style="margin-top:10px">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS.upload}</svg>
                Import files
              </button>
            </div>`}
        </div>
      </div>
      <div class="file-editor" id="file-editor">
        ${editorHTML}
      </div>
      ${previewHTML}`;

    // Attach tree interactions
    document.querySelectorAll('#tree-scroll .tree-node').forEach(node => {
      node.addEventListener('click', () => {
        const fileId = node.dataset.fileId;
        const folderPath = node.dataset.folderPath;
        if (fileId) openFile(fileId);
        else if (folderPath){
          // Toggle folder
          const next = node.parentElement.querySelector('.tree-children');
          if (next) next.style.display = next.style.display === 'none' ? '' : 'none';
        }
      });
      node.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        const fileId = node.dataset.fileId;
        if (!fileId) return;
        const rect = node.getBoundingClientRect();
        showContextMenu(rect, [
          { label:'Open',         icon:'file',  run:() => openFile(fileId) },
          { label:'Rename',       icon:'type',  run:() => renameFilePrompt(fileId) },
          { label:'Duplicate',    icon:'copy',  run:() => duplicateFile(fileId) },
          { label:'Download',     icon:'download', run:() => ExportCenter.exportFile(fileId) },
          { label:'Delete',       icon:'trash', run:() => deleteFilePrompt(fileId) }
        ]);
      });
    });

    // Attach editor input handlers
    attachEditorHandlers();
    updateStatusbar();

  function renderFileTree(){
    const tree = VFS.buildTree();
    function renderNode(node, depth){
      if (node.type === 'folder'){
        return `
          <div class="tree-folder">
            <button class="tree-node" data-folder-path="${Utils.esc(node.path)}" style="padding-left:${8 + depth*12}px">
              <span class="tree-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS.folder}</svg></span>
              <span class="tree-name">${Utils.esc(node.name)}</span>
            </button>
            <div class="tree-children">
              ${node.children.map(c => renderNode(c, depth+1)).join('')}
            </div>
          </div>`;
      }
      const s = Store.get();
      const isSelected = s.workspace.activeFileId === node.id;
      return `
        <button class="tree-node${isSelected?' selected':''}" data-file-id="${node.id}" style="padding-left:${8 + depth*12}px">
          <span class="tree-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[FileTypes.iconFor(node.name)] || ICON_PATHS.file}</svg></span>
          <span class="tree-name">${Utils.esc(node.name)}</span>
        </button>`;
    }
    return tree.children.map(c => renderNode(c, 0)).join('');
  }

  function renderEditorArea(){
    const s = Store.get();
    const project = getActiveProject();
    const files = project ? (project.files||[]) : [];
    if (!files.length){
      return `
        <div class="editor-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS.fileCode}</svg>
          <h3>No files open</h3>
          <p>Import files, or create a new one, to edit HTML, CSS, JS, JSON, Markdown, images, media and more.</p>
          <div style="display:flex;gap:9px;flex-wrap:wrap;justify-content:center">
            <button class="btn primary" data-action="open-import">Import files</button>
            <button class="btn ghost" data-action="workspace-new-file">New file</button>
          </div>
        </div>`;
    }
    const openIds = s.workspace.openFileIds || [];
    const active = s.workspace.activeFileId ? files.find(f => f.id === s.workspace.activeFileId) : null;
    const tabFiles = openIds.map(id => files.find(f => f.id === id)).filter(Boolean);

    const tabs = tabFiles.map(f => `
      <button class="etab${f.id === s.workspace.activeFileId ? ' active' : ''}" data-file-id="${f.id}">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[FileTypes.iconFor(f.name)] || ICON_PATHS.file}</svg>
        <span>${Utils.esc(f.name)}</span>
        <span class="etab-close" data-close-file="${f.id}" role="button" aria-label="Close tab">
          <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </span>
      </button>`).join('');

    if (!active){
      return `
        ${tabs ? `<div class="editor-tabs">${tabs}</div>` : ''}
        <div class="editor-empty" style="flex:1">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS.fileCode}</svg>
          <h3>Select a file</h3>
          <p>Pick a file from the tree to open it. You can open multiple files and switch between tabs.</p>
        </div>`;
    }

    return `
      ${tabs ? `<div class="editor-tabs">${tabs}</div>` : ''}
      <div class="editor-pane" id="editor-pane">
        ${renderFileContent(active)}
      </div>
      <div class="file-meta">
        <span class="mtag">${Utils.esc(active.mime || 'unknown')}</span>
        <span>${Utils.formatBytes(active.size||0)}</span>
        <span>${active.path}</span>
        <span style="margin-left:auto">Modified ${Utils.relTime(active.updatedAt)}</span>
      </div>`;
  }

  function renderFileContent(file){
    const cat = file.category;

    if (cat === 'image'){
      if (/\.svg$/i.test(file.path) && file.content != null){
        // Show SVG inline
        return `
          <div class="img-viewer">
            <div style="background:repeating-conic-gradient(rgba(255,255,255,.05) 0% 25%, transparent 0% 50%) 0 0 / 22px 22px;padding:24px;border-radius:12px;max-width:100%">
              ${file.content}
            </div>
            <div class="media-caption">${Utils.esc(file.path)} · SVG · ${Utils.formatBytes(file.size||0)}</div>
          </div>`;
      }
      const url = file.blob ? URL.createObjectURL(file.blob) : (file.dataUrl || '');
      return `
        <div class="img-viewer">
          <img src="${url}" alt="${Utils.esc(file.name)}" onload="URL.revokeObjectURL && URL.revokeObjectURL(this.src)"/>
          <div class="media-caption">${Utils.esc(file.path)} · ${Utils.formatBytes(file.size||0)}</div>
        </div>`;
    }
    if (cat === 'video'){
      const url = file.blob ? URL.createObjectURL(file.blob) : '';
      return `
        <div class="video-viewer">
          <video controls preload="metadata" src="${url}"></video>
          <div class="media-caption">${Utils.esc(file.path)} · ${Utils.formatBytes(file.size||0)}</div>
        </div>`;
    }
    if (cat === 'audio'){
      const url = file.blob ? URL.createObjectURL(file.blob) : '';
      return `
        <div class="audio-viewer">
          <div style="font-size:38px;opacity:.5">
            <svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS.fileAudio}</svg>
          </div>
          <audio controls src="${url}"></audio>
          <div class="media-caption">${Utils.esc(file.path)} · ${Utils.formatBytes(file.size||0)}</div>
        </div>`;
    }
    if (cat === 'archive'){
      return renderBinaryView(file, 'ZIP archive — expand into the project via Import.');
    }
    if (cat === 'font'){
      return renderBinaryView(file, 'Web font file — will be preserved on export.');
    }
    if (cat === 'binary' || !FileTypes.isEditable(file.path, file.mime)){
      return renderBinaryView(file, 'Binary file — preview not available in the browser.');
    }

    // Text-based editors
    const isCsv = /\.(csv|tsv)$/i.test(file.path);
    const isMd = /\.(md|markdown)$/i.test(file.path);
    const isJson = /\.(json|jsonc)$/i.test(file.path);

    if (isCsv && file.content != null){
      return renderCsvView(file);
    }
    if (isMd && file.content != null){
      return `
        <div class="editor-tabs" style="background:transparent;border-bottom:1px solid var(--border)">
          <button class="etab active" data-md-mode="preview">Preview</button>
          <button class="etab" data-md-mode="edit">Edit</button>
        </div>
        <div class="md-view" id="md-preview">${Utils.renderMarkdown(file.content)}</div>
        <div style="display:none" id="md-editor-wrap">${renderCodeEditor(file)}</div>`;
    }

    return renderCodeEditor(file);
  }

  function renderCodeEditor(file){
    const lines = String(file.content || '').split('\n').length;
    const gutter = Array.from({length: lines}, (_, i) => i + 1).join('\n');
    return `
      <div class="code-wrap">
        <div class="code-gutter" id="code-gutter">${gutter}</div>
        <textarea class="code-area" id="code-area" spellcheck="false" autocomplete="off"
                  data-file-id="${file.id}" aria-label="Edit ${Utils.esc(file.name)}">${Utils.esc(file.content||'')}</textarea>
      </div>`;
  }

  function renderCsvView(file){
    const lines = String(file.content||'').split(/\r?\n/).filter(Boolean).slice(0, 500);
    const rows = lines.map(l => parseCsvLine(l));
    if (!rows.length) return renderCodeEditor(file);
    const headers = rows[0];
    const body = rows.slice(1);
    return `
      <div class="editor-tabs" style="background:transparent;border-bottom:1px solid var(--border)">
        <button class="etab active" data-csv-mode="table">Table</button>
        <button class="etab" data-csv-mode="edit">Edit</button>
      </div>
      <div class="csv-view" id="csv-table">
        <table>
          <thead><tr>${headers.map(h => `<th>${Utils.esc(h)}</th>`).join('')}</tr></thead>
          <tbody>
            ${body.map(row => `<tr>${headers.map((_,i) => `<td>${Utils.esc(row[i] ?? '')}</td>`).join('')}</tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div style="display:none" id="csv-editor-wrap">${renderCodeEditor(file)}</div>`;
  }

  function parseCsvLine(line){
    const out = []; let cur = ''; let inQ = false;
    for (let i=0;i<line.length;i++){
      const ch = line[i];
      if (inQ){
        if (ch === '"' && line[i+1] === '"'){ cur += '"'; i++; }
        else if (ch === '"') inQ = false;
        else cur += ch;
      } else {
        if (ch === '"') inQ = true;
        else if (ch === ','){ out.push(cur); cur = ''; }
        else cur += ch;
      }
    }
    out.push(cur);
    return out;
  }

  function renderBinaryView(file, note){
    return `
      <div class="bin-view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[FileTypes.iconFor(file.name)] || ICON_PATHS.file}</svg>
        <h3>${Utils.esc(file.name)}</h3>
        <p>${Utils.esc(note)}</p>
        <div class="meta-grid">
          <div class="meta-item"><div class="k">Path</div><div class="v">${Utils.esc(file.path)}</div></div>
          <div class="meta-item"><div class="k">MIME</div><div class="v">${Utils.esc(file.mime || 'unknown')}</div></div>
          <div class="meta-item"><div class="k">Size</div><div class="v">${Utils.formatBytes(file.size||0)}</div></div>
          <div class="meta-item"><div class="k">Category</div><div class="v">${Utils.esc(file.category||'unknown')}</div></div>

          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS.download}</svg>
          Download original
        </button>
      </div>`;

  function renderPreviewPane(){
    const s = Store.get();
    const project = getActiveProject();
    if (!project) return '';
    const files = project.files || [];
    const htmlFiles = files.filter(f => /\.html?$/i.test(f.path));
    if (!htmlFiles.length){
      return `
        <div class="preview-pane">
          <div class="preview-head">
            <span>Live preview</span>
          </div>
          <div class="preview-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS.globe}</svg>
            <p>No HTML entry point in this project. Import an .html file to enable live preview.</p>
          </div>
        </div>`;
    }
    const entry = htmlFiles.find(f => f.id === s.workspace.previewFileId) || htmlFiles[0];
    const url = buildPreviewBlob(project, entry);
    return `
      <div class="preview-pane">
        <div class="preview-head">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS.globe}</svg>
          <span>Live preview · ${Utils.esc(entry.path)}</span>
          <div class="ph-actions">
            <button data-action="preview-reload" title="Reload">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS.refresh}</svg>
            </button>
            <button data-action="preview-close" title="Close preview">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
          </div>
        </div>
        <div class="preview-iframe-wrap">
          <iframe class="preview-iframe" id="preview-iframe" sandbox="allow-same-origin allow-scripts allow-forms allow-popups" src="${url}" title="Live preview"></iframe>
        </div>
      </div>`;
  }

  /** Build a Blob URL for an HTML file with local assets inlined where possible. */
  function buildPreviewBlob(project, entry){
    const result = ConversionService.buildSingleHtml({
      ...project,
      files: [entry, ...(project.files||[])]
    });
    if (!result || !result.ok){
      return 'about:blank';
    }
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = URL.createObjectURL(new Blob([result.html], { type:'text/html' }));
    return previewUrl;
  }

  function attachEditorHandlers(){
    // Code editor
    const area = document.getElementById('code-area');
    if (area){
      const gutter = document.getElementById('code-gutter');
      const fileId = area.dataset.fileId;
      const updateGutter = () => {
        const lines = area.value.split('\n').length;
        if (gutter) gutter.textContent = Array.from({length: lines}, (_, i) => i + 1).join('\n');
      };
      const commit = Utils.debounce(() => {
        const file = VFS.find(fileId); if (!file) return;
        file.content = area.value;
        file.updatedAt = Date.now();
        const project = getActiveProject();
        if (project) project.updatedAt = Date.now();
        saveToStorage(true);
        updateStatusbar();
      }, 320);
      area.addEventListener('input', () => { updateGutter(); commit(); });
      // Tab key inserts spaces
      area.addEventListener('keydown', (e) => {
        if (e.key === 'Tab'){
          e.preventDefault();
          const start = area.selectionStart, end = area.selectionEnd;
          area.value = area.value.slice(0, start) + '  ' + area.value.slice(end);
          area.selectionStart = area.selectionEnd = start + 2;
          updateGutter();
          commit();
        }
      });
    }

    // CSV / Markdown toggles
    document.querySelectorAll('[data-csv-mode]').forEach(btn => {
      btn.addEventListener('click', () => {
        const mode = btn.dataset.csvMode;
        document.querySelectorAll('[data-csv-mode]').forEach(b => b.classList.toggle('active', b === btn));
        const table = document.getElementById('csv-table');
        const editor = document.getElementById('csv-editor-wrap');
        if (table) table.style.display = mode === 'table' ? '' : 'none';
        if (editor) editor.style.display = mode === 'edit' ? '' : 'none';
        if (mode === 'edit' && editor && !editor.dataset.bound){
          editor.dataset.bound = '1';
          const ta = editor.querySelector('#code-area');
          if (ta){
            const file = VFS.find(ta.dataset.fileId);
            ta.addEventListener('input', Utils.debounce(() => {
              if (!file) return;
              file.content = ta.value;
              file.updatedAt = Date.now();
              saveToStorage(true);
            }, 320));
          }
        }
      });
    });
    document.querySelectorAll('[data-md-mode]').forEach(btn => {
      btn.addEventListener('click', () => {
        const mode = btn.dataset.mdMode;
        document.querySelectorAll('[data-md-mode]').forEach(b => b.classList.toggle('active', b === btn));
        const preview = document.getElementById('md-preview');
        const editor = document.getElementById('md-editor-wrap');
        if (preview) preview.style.display = mode === 'preview' ? '' : 'none';
        if (editor) editor.style.display = mode === 'edit' ? '' : 'none';
        if (mode === 'edit' && editor && !editor.dataset.bound){
          editor.dataset.bound = '1';
          const ta = editor.querySelector('#code-area');
          if (ta){
            const file = VFS.find(ta.dataset.fileId);
            ta.addEventListener('input', Utils.debounce(() => {
              if (!file) return;
              file.content = ta.value;
              file.updatedAt = Date.now();
              saveToStorage(true);
            }, 320));
          }
        }
      });
    });

    // File tabs
    document.querySelectorAll('.etab[data-file-id]').forEach(tab => {
      tab.addEventListener('click', (e) => {
        if (e.target.closest('[data-close-file]')) return;
        openFile(tab.dataset.fileId);
      });
    });
    document.querySelectorAll('[data-close-file]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        closeFile(btn.dataset.closeFile);
      });
    });
  }

  function updateStatusbar(){
    const statusFiles = document.getElementById('status-files');
    if (statusFiles){
      const project = getActiveProject();
      if (project && project.files && project.files.length){
        statusFiles.style.display = 'flex';
        const size = project.files.reduce((a,f) => a + (f.size||0), 0);
        statusFiles.textContent = `${project.files.length} files · ${Utils.formatBytes(size)}`;
      } else statusFiles.style.display = 'none';
    }
  }

  /* File management actions */
  function renameFilePrompt(fileId){
    const file = VFS.find(fileId); if (!file) return;
    Modal.open({
      title:'Rename file',
      subtitle: file.path,
      icon:'type', size:420,
      body: `
        <div class="field"><div class="field-label">New name</div>
          <input class="input" id="rename-input" value="${Utils.esc(file.name)}" autocomplete="off"/></div>`,
      actions: [
        { label:'Cancel', variant:'ghost' },
        { label:'Rename', variant:'primary', onClick: (overlay, close) => {
          const newName = overlay.querySelector('#rename-input').value.trim();
          close();
          if (!newName || newName === file.name) return;
          VFS.renameFile(fileId, newName);
          saveToStorage(true);
          renderWorkspaceBody();
          Notify.success('File renamed', newName);
        }}
      ],
      onMount: overlay => {
        const inp = overlay.querySelector('#rename-input');
        setTimeout(() => { inp.focus(); inp.select(); }, 60);
        inp.addEventListener('keydown', ev => {
          if (ev.key === 'Enter') overlay.querySelector('[data-modal-action="1"]')?.click();
        });
      }
    });
  }

  function duplicateFile(fileId){
    const file = VFS.find(fileId); if (!file) return;
    const copy = Utils.clone(file);
    copy.id = Utils.uid('file');
    copy.path = VFS.uniquePath(file.path);
    copy.name = FileTypes.baseName(copy.path);
    copy.createdAt = Date.now();
    copy.updatedAt = Date.now();
    // Blob references are safe to share
    VFS.addFile(copy);
    saveToStorage(true);
    renderWorkspaceBody();
    renderShell();
    Notify.success('File duplicated', copy.name);
  }

  async function deleteFilePrompt(fileId){
    const file = VFS.find(fileId); if (!file) return;
    const ok = await Modal.confirm({
      title:'Delete file?',
      message:`“${file.path}” will be removed from this project. This cannot be undone.`,
      confirmLabel:'Delete', variant:'danger'
    });
    if (!ok) return;
    VFS.removeFile(fileId);
    const s = Store.get();
    Store.patch('workspace', Object.assign({}, s.workspace, {
      openFileIds: s.workspace.openFileIds.filter(id => id !== fileId),
      activeFileId: s.workspace.activeFileId === fileId ? null : s.workspace.activeFileId
    }));
    saveToStorage(true);
    renderWorkspaceBody();
    renderShell();
    Notify.success('File deleted', file.name);
  }

  function newFilePrompt(){
    Modal.open({
      title:'Create new file',
      subtitle:'Choose a filename with an extension — the editor adapts automatically.',
      icon:'plus', size:460,
      body: `
        <div class="field"><div class="field-label">File path</div>
          <input class="input" id="newfile-path" placeholder="e.g. css/styles.css or content/data.json" autocomplete="off"/></div>
        <div class="field"><div class="field-label">Starter content</div>
          <select class="select" id="newfile-starter">
            <option value="empty">Empty file</option>
            <option value="html">HTML5 boilerplate</option>
            <option value="css">CSS reset snippet</option>
            <option value="js">JavaScript module stub</option>
            <option value="md">Markdown document</option>
            <option value="json">Empty JSON object</option>
          </select></div>`,
      actions: [
        { label:'Cancel', variant:'ghost' },
        { label:'Create', variant:'primary', onClick: (overlay, close) => {
          const path = overlay.querySelector('#newfile-path').value.trim().replace(/^\/+/, '');
          const starter = overlay.querySelector('#newfile-starter').value;
          close();
          if (!path){ Notify.warning('Path required'); return; }
          if (!FileTypes.extensionOf(path)){
            Notify.warning('Extension required', 'Include a file extension such as .html or .css.');
            return;
          }
          if (VFS.findByName(path)){
            Notify.warning('File already exists', 'Choose a different path.');
            return;
          }
          const content = getStarterContent(starter, path);
          const record = {
            id: Utils.uid('file'),
            name: FileTypes.baseName(path),
            path,
            mime: FileTypes.mimeFor(path),
            size: new Blob([content]).size,
            ext: FileTypes.extensionOf(path),
            category: FileTypes.categoryFor(path),
            createdAt: Date.now(),
            updatedAt: Date.now(),
            content,
            dataUrl: null,
            blob: null
          };
          VFS.addFile(record);
          saveToStorage(true);
          logActivity('create', `Created ${path}`);
          renderWorkspaceBody();
          renderShell();
          openFile(record.id);
          Notify.success('File created', path);
        }}
      ],
      onMount: overlay => {
        setTimeout(() => overlay.querySelector('#newfile-path')?.focus(), 60);
      }
    });
  }

  function getStarterContent(kind, path){
    if (kind === 'html') return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>${FileTypes.baseName(path).replace(/\.[^.]+$/, '')}</title>
</head>
<body>
  <h1>Hello from Nebula Studio</h1>
  <p>Edit this file and watch the live preview update.</p>
</body>
</html>`;
    if (kind === 'css') return `/* ${path} */
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
  line-height: 1.5;
  background: #0b0d14;
  color: #e9edf7;
}
`;
    if (kind === 'js') return `// ${path}
export function init() {
  console.log('Nebula module ready');
}

init();
`;
    if (kind === 'md') return `# ${FileTypes.baseName(path).replace(/\.md$/, '')}

A new Markdown document.

## Section

- Item one
- Item two
`;
    if (kind === 'json') return `{
  "name": "sample",
  "items": []
}
`;
    return '';
  }

  return {
    mount, renderWorkspace, renderWorkspaceBody, openFile, closeFile,
    newFilePrompt, renameFilePrompt, duplicateFile, deleteFilePrompt,
    updateStatusbar
  };
})();

function saveToStorage(silent){
  try {
    const s = Store.get();
    if (!silent) Store.patch('ui', Object.assign({}, s.ui, { saveState:'saving' }));
    Storage.set('projects', s.projects);
    Storage.set('activity', s.activity);
    Storage.set('settings', s.settings);
    Storage.set('activeProjectId', s.activeProjectId);
    Storage.set('activePageId', s.activePageId);
    Storage.set('search', s.search);
    Storage.set('editor', { device: s.editor.device, zoom: s.editor.zoom, autoFit: s.editor.autoFit });
    Store.patch('ui', Object.assign({}, Store.get().ui, { saveState:'saved', lastSavedAt: Date.now() }));
    renderShell();
    return true;
  } catch(err){
    console.error('[saveToStorage]', err);
    if (!silent) Notify.error('Save failed', 'Local storage is unavailable or full.');
    return false;
  }
}
function logActivity(type, text){
  const s = Store.get();
  const entry = { id: Utils.uid('act'), type, text, ts: Date.now() };
  const activity = [entry, ...s.activity].slice(0, 200);
  Store.patch('activity', activity);
  Storage.set('activity', activity);
}

function applySettings(){
  const s = Store.get();
  const a = s.settings.appearance, perf = s.settings.performance;
  const root = document.documentElement;
  const glassAlpha = Utils.clamp((a.glass/100)*0.12, 0, 0.16);
  root.style.setProperty('--glass-alpha', glassAlpha.toFixed(4));
  const blur = Utils.clamp(6 + (a.glass/100)*22, 0, 30);
  root.style.setProperty('--blur', blur.toFixed(0) + 'px');
  const glow = Utils.clamp(a.glow/100, 0, 1);
  root.style.setProperty('--glow-strength', glow.toFixed(2));
  document.querySelectorAll('.orb').forEach(o => { o.style.opacity = (0.14 + glow*0.4).toFixed(2); });
  const reduceMotion = perf.reducedMotion || window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.body.dataset.motion = (reduceMotion || !a.animations) ? 'off' : 'on';
  document.body.dataset.effects = perf.effectsQuality === 'low' ? 'low' : 'high';
  API_CONFIG.provider = s.settings.api.provider;
  API_CONFIG.model = s.settings.api.model;
  API_CONFIG.baseURL = s.settings.api.baseURL;
  const live = AIService.isLive();
  Store.patch('apiStatus', {
    connected: live, provider: s.settings.api.provider,
    label: live ? `Live · ${s.settings.api.provider}` : 'Mock services',
    lastCheck: Date.now()
  });
}
