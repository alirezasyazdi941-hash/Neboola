/** Import handling for project JSON (separate from universal file import). */
function handleImport(raw){
  let data;
  try { data = JSON.parse(raw); }
  catch(e){ Notify.error('Import failed', 'The file is not valid JSON.'); return; }
  let incoming = [];
  if (data && data.format === 'nebula-studio-project' && data.project) incoming = [data.project];
  else if (data && data.format === 'nebula-studio-bundle' && Array.isArray(data.projects)) incoming = data.projects;
  else if (data && typeof data === 'object' && data.pages && data.name) incoming = [data];
  else { Notify.error('Import failed', 'This file does not look like a Nebula Studio project.'); return; }

  const valid = [];
  incoming.forEach(p => {
    if (!p || typeof p !== 'object') return;
    if (!p.name || !Array.isArray(p.pages)) return;
    const project = {
      id: Utils.uid('prj'),
      name: String(p.name).slice(0, 120),
      description: String(p.description || 'Imported project').slice(0, 300),
      tag: String(p.tag || 'Imported').slice(0, 24),
      createdAt: Number(p.createdAt) || Date.now(),
      updatedAt: Date.now(),
      accent: typeof p.accent === 'string' && p.accent ? p.accent : '#4da3ff',
      files: Array.isArray(p.files) ? p.files.map(normalizeFile) : [],
      pages: p.pages
        .filter(pg => pg && Array.isArray(pg.elements))
        .map(pg => ({
          id: Utils.uid('pg'),
          name: String(pg.name || 'Page').slice(0, 80),
          path: String(pg.path || '/').slice(0, 120),
          height: Number(pg.height) || 900,
          elements: pg.elements.filter(e => e && typeof e === 'object').map(normalizeElement)
        }))
    };
    if (project.pages.length) valid.push(project);
  });
  if (!valid.length){
    Notify.error('Import failed', 'No valid projects were found in that file.');
    return;
  }
  const s = Store.get();
  Store.patch('projects', [...valid, ...s.projects]);
  logActivity('import', `Imported ${valid.length} project${valid.length===1?'':'s'}`);
  saveToStorage(true);
  renderCurrentView();
  renderShell();
  Notify.success('Import complete', `${valid.length} project${valid.length===1?'':'s'} added.`);
}

function normalizeElement(e){
  const layout = (e.layout && e.layout.desktop) || { x:40, y:40, w:320, h:80 };
  return {
    id: Utils.uid('el'),
    type: ELEMENT_TYPES[e.type] ? e.type : 'text',
    name: String(e.name || ELEMENT_TYPES[e.type] || 'Element').slice(0, 80),
    layout: { desktop: {
      x: Number(layout.x) || 0,
      y: Number(layout.y) || 0,
      w: Math.max(16, Number(layout.w) || 320),
      h: Math.max(1, Number(layout.h) || 80)
    }},
    props: (e.props && typeof e.props === 'object') ? e.props : {},
    style: Object.assign({}, DEFAULT_STYLE, (e.style && typeof e.style === 'object') ? e.style : {}),
    motion: Object.assign({ type:'none', duration:500, delay:0 }, (e.motion && typeof e.motion === 'object') ? e.motion : {}),
    z: Number(e.z) || 1,
    visible: e.visible !== false,
    locked: Boolean(e.locked)
  };
}

function normalizeFile(f){
  const ext = FileTypes.extensionOf(f.path || f.name || '');
  return {
    id: Utils.uid('file'),
    name: FileTypes.baseName(f.path || f.name || 'file'),
    path: String(f.path || f.name || 'file'),
    mime: f.mime || FileTypes.mimeFor(f.path || f.name || ''),
    size: Number(f.size) || 0,
    ext,
    category: f.category || FileTypes.categoryFor(f.path || f.name || ''),
    createdAt: Number(f.createdAt) || Date.now(),
    updatedAt: Number(f.updatedAt) || Date.now(),
    content: f.content != null ? String(f.content) : null,
    dataUrl: f.dataUrl || null,
    blob: null
  };
}

        Store.patch('workspace', Object.assign({}, s.workspace, { treeOpen: !s.workspace.treeOpen }));

      },

        Workspace.renderWorkspaceBody();
      },
      'workspace-refresh': () => Workspace.renderWorkspaceBody(),

    return;
  }
  e.preventDefault();
  e.stopPropagation();
  try { handler(actionEl, { dataset: actionEl.dataset }); }
  catch(err){
    console.error(`[Action:${action}]`, err);
    Notify.error('Action failed', err.message || 'Something went wrong.');
  }
});

document.addEventListener('input', Utils.debounce(e => {
  const target = e.target;
  if (target.dataset.setting){
    const path = target.dataset.setting;
    let value;
    if (target.type === 'checkbox') value = target.checked;
    else if (target.type === 'range' || target.type === 'number') value = Number(target.value);
    else value = target.value;
    const s = Store.get();
    const next = Utils.clone(s.settings);
    Utils.deepSet(next, path, value);
    Store.patch('settings', next);
    Storage.set('settings', next);
    applySettings();
    const label = target.closest('.field')?.querySelector('.field-label .val');
    if (label && (target.type === 'range' || target.type === 'number')){
      const suffix = path.includes('opacity') ? '%'
        : path.includes('glass') || path.includes('glow') ? '%'
        : path.includes('letterSpacing') || path.includes('radius') || path.includes('padding') || path.includes('borderWidth') ? 'px'
        : '';
      const display = path.includes('opacity') ? Math.round(value*100) : value;
      label.textContent = display + suffix;
    }
    return;
  }
  if (target.dataset.prop){
    const sel = getSelectedElement();
    if (!sel) return;
    const path = target.dataset.prop;
    let value;
    if (target.type === 'checkbox') value = target.checked;
    else if (target.type === 'range' || target.type === 'number') value = Number(target.value);
    else value = target.value;
    if (path.startsWith('layout.')){
      const key = path.split('.')[1];
      const device = Store.get().editor.device;
      const num = Number(value);
      if (!isNaN(num)) setLayoutValue(sel, device, key, num);
    } else if (path === 'name'){ sel.name = value; }
    else if (path === 'z'){ sel.z = Number(value) || 1; }
    else if (path === 'visible'){ sel.visible = value; }
    else if (path === 'locked'){ sel.locked = value; }
    else Utils.deepSet(sel, path, value);
    if (path.startsWith('layout.')){
      const node = document.querySelector(`[data-el-id="${sel.id}"]`);
      const layout = getLayout(sel, Store.get().editor.device);
      if (node){
        node.style.left = layout.x + 'px'; node.style.top = layout.y + 'px';
        node.style.width = layout.w + 'px'; node.style.height = layout.h + 'px';
      }
      updateFloatingBar(layout);
    } else rerenderCanvas();
    const label = target.closest('.field')?.querySelector('.field-label .val');
    if (label && (target.type === 'range' || target.type === 'number')){
      const suffix = path.includes('fontSize') || path.includes('radius') || path.includes('padding') || path.includes('borderWidth') || path.includes('letterSpacing') ? 'px'
        : path.includes('opacity') ? '%' : '';
      const display = path.includes('opacity') ? Math.round(value*100) : value;
      label.textContent = display + suffix;
    }
    debouncedElementCommit();
  }
}, 20));

const debouncedElementCommit = Utils.debounce(() => {
  commitHistory('Edit element');
  scheduleAutosave();
}, 420);

document.addEventListener('change', e => {
  const target = e.target;
  if (target.tagName !== 'SELECT') return;
  if (target.dataset.prop){
    const sel = getSelectedElement(); if (!sel) return;
    const path = target.dataset.prop;
    let value = target.value;
    if (path === 'style.fontWeight' || path === 'motion.duration' || path === 'motion.delay') value = Number(value);
    Utils.deepSet(sel, path, value);
    commitHistory('Change element');
    scheduleAutosave(); rerenderCanvas(); renderInspector();
  }
});

/* --------------------------------------------------------------------------
 * Drag & drop — window-wide
 * ------------------------------------------------------------------------ */
(function setupDragDrop(){
  const overlay = document.getElementById('drop-overlay');
  let counter = 0;
  let lastDragOver = 0;

  function showOverlay(){ if (overlay){ overlay.classList.add('show'); overlay.setAttribute('aria-hidden','false'); } }
  function hideOverlay(){ if (overlay){ overlay.classList.remove('show'); overlay.setAttribute('aria-hidden','true'); } }

  window.addEventListener('dragenter', e => {
    // Only file drags
    if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
    e.preventDefault();
    counter++;
    if (counter === 1) showOverlay();
  });
  window.addEventListener('dragover', e => {
    if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    // Throttle update
    const now = Date.now();
    if (now - lastDragOver > 60) lastDragOver = now;
  });
  window.addEventListener('dragleave', e => {
    if (!e.dataTransfer) return;
    counter = Math.max(0, counter - 1);
    if (counter === 0) hideOverlay();
  });
  window.addEventListener('drop', async e => {
    if (!e.dataTransfer) return;
    if (!Array.from(e.dataTransfer.types || []).includes('Files')) return;
    e.preventDefault();
    counter = 0; hideOverlay();

    let files = [];
    try { files = await UniversalImporter.collectFilesFromDataTransfer(e.dataTransfer); }
    catch(err){ files = Array.from(e.dataTransfer.files || []); }

    if (!files.length){ Notify.warning('No files detected', 'Try dropping individual files or a folder.'); return; }

    // Size check
    const totalSize = files.reduce((a,f) => a + f.size, 0);
    if (totalSize > MAX_TOTAL_SIZE){
      const ok = await Modal.confirm({
        title:'Large drop detected',
        message:`${Utils.formatBytes(totalSize)} will be imported. Large imports may take a while and use significant memory. Continue?`,
        confirmLabel:'Continue'
      });
      if (!ok) return;
    }

    UniversalImporter.importFiles(files);
  });
})();

/* --------------------------------------------------------------------------
 * Keyboard shortcuts
 * ------------------------------------------------------------------------ */
document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey;
  const tag = (e.target.tagName || '').toLowerCase();
  const isTyping = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;

  // ---- Global keyboard shortcuts ----
  if (mod && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    Palette.open();
    return;
  }
  if (mod && e.key.toLowerCase() === 's') {
    e.preventDefault();
    saveToStorage(false);
    Notify.success('Saved', 'Project state written to local storage.');
    return;
  }
  if (mod && e.key.toLowerCase() === 'o') {
    e.preventDefault();
    openImportCenter();
    return;
  }
  if (mod && e.key.toLowerCase() === 'e') {
    e.preventDefault();
    openExportCenter();
    return;
  }
  if (mod && e.key.toLowerCase() === 'z' && !e.shiftKey) {
    if (isTyping) return;
    e.preventDefault();
    if (typeof Actions !== 'undefined' && Actions.undo) Actions.undo();
    else if (History.canUndo()) {
      const result = History.undo();
      if (result && result.snap) applyHistorySnapshot(result.snap);
    }
    return;
  }
  if (mod && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) {
    if (isTyping) return;
    e.preventDefault();
    if (typeof Actions !== 'undefined' && Actions.redo) Actions.redo();
    else if (History.canRedo()) {
      const result = History.redo();
      if (result && result.snap) applyHistorySnapshot(result.snap);
    }
    return;
  }
  if (e.key === 'Escape') {
    const paletteRoot = document.getElementById('palette-root');
    if (paletteRoot && paletteRoot.firstChild) {
      paletteRoot.innerHTML = '';
      return;
    }
    const modalRoot = document.getElementById('modal-root');
    if (modalRoot && modalRoot.firstChild) {
      modalRoot.innerHTML = '';
      return;
    }
    if (Store.get().selectedElementId) {
      Store.patch('selectedElementId', null);
      if (typeof rerenderCanvas === 'function') rerenderCanvas();
      if (typeof renderInspector === 'function') renderInspector();
    }
    return;
  }
  if (!isTyping && (e.key === 'Delete' || e.key === 'Backspace')) {
    const id = Store.get().selectedElementId;
    if (id && Actions['delete-element']) {
      e.preventDefault();
      Actions['delete-element']({ dataset: { id: id } });
    }
    return;
  }
  if (!isTyping && mod && e.key.toLowerCase() === 'd') {
    const id = Store.get().selectedElementId;
    if (id && Actions['duplicate-element']) {
      e.preventDefault();
      Actions['duplicate-element']({ dataset: { id: id } });
    }
    return;
  }
  if (!isTyping && !mod && ['1','2','3','4','5'].includes(e.key)) {
    const map = { '1':'dashboard', '2':'workspace', '3':'editor', '4':'activity', '5':'settings' };
    e.preventDefault();
    Actions.navigate(null, { dataset: { view: map[e.key] } });
  }
});

/* --------------------------------------------------------------------------
 * Bootstrap
 * ------------------------------------------------------------------------ */
function bootstrap() {
  installErrorBoundary();

  const projects = Storage.get('projects', null);
  const activity = Storage.get('activity', []);
  const settings = Storage.get('settings', null);
  const activeProjectId = Storage.get('activeProjectId', null);
  const activePageId = Storage.get('activePageId', null);
  const editorSnap = Storage.get('editor', null);

  const defaultSettings = buildDefaultSettings();
  const mergedSettings = settings
    ? Object.assign({}, defaultSettings, settings, {
        appearance: Object.assign({}, defaultSettings.appearance, (settings && settings.appearance) || {}),
        editor: Object.assign({}, defaultSettings.editor, (settings && settings.editor) || {}),
        performance: Object.assign({}, defaultSettings.performance, (settings && settings.performance) || {}),
        api: Object.assign({}, defaultSettings.api, (settings && settings.api) || {})
      })
    : defaultSettings;

  let projectList = Array.isArray(projects) ? projects : null;
  if (!projectList || !projectList.length) {
    projectList = buildDemoProjects();
  }

  const initialWorkspace = {
    openFileIds: [],
    activeFileId: null,
    previewOpen: false,
    treeOpen: true,
    previewFileId: null
  };

  Store.set({
    projects: projectList,
    activity: Array.isArray(activity) ? activity : [],
    settings: mergedSettings,
    activeProjectId: activeProjectId || (projectList[0] && projectList[0].id) || null,
    activePageId: activePageId || null,
    selectedElementId: null,
    activeView: 'dashboard',
    search: { recent: [] },
    ui: { saveState: 'ready', lastSavedAt: null },
    apiStatus: { connected: false, provider: 'mock', label: 'Mock services', lastCheck: Date.now() },
    editor: Object.assign({
      device: 'desktop',
      zoom: 0.72,
      autoFit: true,
      sidebarOpen: false,
      grid: true,
      previewMode: false,
      inspectorOpen: false
    }, editorSnap || {}),
    workspace: initialWorkspace,
    inspectorTab: 'content'
  });

  const ap = getActiveProject();
  if (ap) {
    const pageOk = ap.pages && ap.pages.some(function(p){ return p.id === Store.get().activePageId; });
    if (!pageOk) {
      Store.patch('activePageId', ap.pages[0] ? ap.pages[0].id : null);
    }
    History.reset(ap);
  } else {
    History.reset(null);
  }

  applySettings();
  renderShell();
  renderCurrentView();
  updateHistoryButtons();

  if (!Storage.get('seenWelcome', false)) {
    Storage.set('seenWelcome', true);
    setTimeout(function(){
      Notify.info('Welcome to Nebula Studio', 'Demo mode — everything runs locally. Import files or create a project to start.');
    }, 600);
  }

  console.info('[Nebula Studio]', APP_VERSION, 'ready — isolated local mode');
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootstrap);
} else {
  bootstrap();
}

})(); // end IIFE
